function pack(){return {selected:Object.fromEntries(kinds.map(kind=>[kind,[...selected[kind]]])),blockedIds:[...rejected]};}
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(pack()))}catch{}document.getElementById('status').textContent='选择已保存在此浏览器，尚未应用到项目。';}
function esc(text){const e=document.createElement('span');e.textContent=String(text||'');return e.innerHTML}
function tabs(){document.querySelector('.tabs').innerHTML=kinds.map(kind=>'<button class="tab '+(kind===current?'active':'')+'" data-kind="'+kind+'" aria-pressed="'+(kind===current)+'">'+names[kind]+'<small>已选 '+selected[kind].size+' / '+items[kind].length+'</small></button>').join('');}
function render(){document.querySelectorAll('audio').forEach(a=>a.pause());tabs();const query=document.getElementById('search').value.trim().toLowerCase(),mode=document.getElementById('filter').value;
filtered=items[current].filter(item=>(mode==='rejected'?rejected.has(item.id):!rejected.has(item.id))&&(mode!=='selected'||selected[current].has(item.id))&&(!query||[item.duanzi,item.songName,item.nickname,item.singer].join(' ').toLowerCase().includes(query)));
const pages=Math.max(1,Math.ceil(filtered.length/20));page=Math.min(page,pages);visible=filtered.slice((page-1)*20,page*20);
document.getElementById('stats').textContent='本分类已选 '+selected[current].size+' 条，筛选结果 '+filtered.length+' 条';
document.getElementById('page-number').textContent=page+' / '+pages;document.getElementById('prev').disabled=page===1;document.getElementById('next').disabled=page===pages;
document.getElementById('pick-page').disabled=mode==='rejected';document.getElementById('unpick-page').disabled=mode==='rejected';
document.getElementById('list').innerHTML=visible.map(item=>'<article class="item '+(selected[current].has(item.id)?'selected':'')+' '+(rejected.has(item.id)?'rejected':'')+'"><input class="pick" type="checkbox" data-pick="'+item.id+'" aria-label="选入首屏：'+esc((item.duanzi||item.songName).slice(0,45)).replace(/"/g,'&quot;')+'" '+(selected[current].has(item.id)?'checked ':'')+(rejected.has(item.id)?'disabled':'')+'><div>'+(current==='audio'?'<h2 class="song-name">'+esc(item.songName)+'</h2><div class="song-meta">'+esc(item.nickname)+' · 原唱 '+esc(item.singer)+' · '+item.durationSec+' 秒　<a href="'+esc(item.link)+'" target="_blank" rel="noopener noreferrer">来源</a></div><audio controls preload="none" src="'+esc(item.audioUrl)+'"></audio>'+(item.lyrics.length?'<details class="lyrics"><summary>查看歌词</summary><p>'+esc(item.lyrics.join('\n'))+'</p></details>':''):'<p class="text">'+esc(item.duanzi)+'</p>')+'<div class="row-foot"><span>'+(selected[current].has(item.id)?'已选入首屏':'未选入首屏')+'</span><button class="reject" data-reject="'+item.id+'">'+(rejected.has(item.id)?'恢复候选':'剔除')+'</button></div></div></article>').join('')||'<div class="empty">没有符合条件的内容，可以换个范围或搜索词。</div>';
document.getElementById('summary').innerHTML='<strong>首屏包：</strong>'+kinds.map(kind=>names[kind]+' '+selected[kind].size+' 条').join(' · ')+'<br>已剔除 '+rejected.size+' 条；当前候选基于 '+esc(data.generatedAt.slice(0,10))+' 的上游快照。';}
document.querySelector('.tabs').addEventListener('click',e=>{const button=e.target.closest('[data-kind]');if(!button)return;current=button.dataset.kind;page=1;document.getElementById('search').value='';render()});
document.getElementById('search').addEventListener('input',()=>{page=1;render()});document.getElementById('filter').addEventListener('change',()=>{page=1;render()});
document.getElementById('list').addEventListener('change',e=>{const id=e.target.dataset.pick;if(!id)return;e.target.checked?selected[current].add(id):selected[current].delete(id);persist();render()});
document.getElementById('list').addEventListener('click',e=>{const button=e.target.closest('[data-reject]');if(!button)return;const id=button.dataset.reject;if(rejected.has(id))rejected.delete(id);else{rejected.add(id);selected[current].delete(id)}persist();render()});
document.getElementById('list').addEventListener('play',e=>document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()}),true);
document.getElementById('pick-page').onclick=()=>{visible.forEach(item=>selected[current].add(item.id));persist();render()};document.getElementById('unpick-page').onclick=()=>{visible.forEach(item=>selected[current].delete(item.id));persist();render()};
document.getElementById('prev').onclick=()=>{page--;render();scrollTo({top:0,behavior:'auto'})};document.getElementById('next').onclick=()=>{page++;render();scrollTo({top:0,behavior:'auto'})};
document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(pack(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='笑料铺子-首屏选择.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('status').textContent='选择包已导出；可以保留备份或导入其他设备。'};
document.getElementById('import').onchange=async e=>{if(!e.target.files.length)return;try{adopt(JSON.parse(await e.target.files[0].text()));persist();page=1;render()}catch(error){document.getElementById('status').textContent=error.message}e.target.value=''};
document.getElementById('apply').onclick=async()=>{const button=document.getElementById('apply');button.disabled=true;document.getElementById('status').textContent='正在保存选中的首屏内容…';try{const response=await fetch('starter-selection',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pack())});const result=await response.json();if(!response.ok)throw Error(result.error||'保存失败');document.getElementById('status').innerHTML='已应用，并保留了上一份备份。<a href="./" target="_blank" rel="noopener">查看本地页面</a>';}catch(error){document.getElementById('status').textContent='本地应用未成功，可先导出选择包。'+error.message}finally{button.disabled=false}};
(async()=>{let value=defaults;try{if(location.protocol!=='file:'){const response=await fetch('starter-selection.json',{cache:'no-store'});if(response.ok)value=await response.json()}const draft=localStorage.getItem(storageKey);if(draft)value=JSON.parse(draft);}catch{}try{adopt(value)}catch{adopt(defaults)}if(location.protocol==='file:'||!['localhost','127.0.0.1'].includes(location.hostname)){document.getElementById('apply').disabled=true;document.getElementById('status').textContent='独立文件可筛选并导出；本地服务中可以直接应用。'}render()})();
</script></body></html>
