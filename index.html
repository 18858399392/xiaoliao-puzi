            <button class="accent-opt auto-opt" type="button" data-accent="" title="跟随主题" aria-label="跟随主题"></button>
            <button class="accent-opt" type="button" data-accent="#1d9bf0" style="background:#1d9bf0" aria-label="蓝色"></button>
            <button class="accent-opt" type="button" data-accent="#f91880" style="background:#f91880" aria-label="粉色"></button>
            <button class="accent-opt" type="button" data-accent="#ff8a3d" style="background:#ff8a3d" aria-label="橙色"></button>
            <button class="accent-opt" type="button" data-accent="#17bf63" style="background:#17bf63" aria-label="绿色"></button>
            <button class="accent-opt" type="button" data-accent="#794bc4" style="background:#794bc4" aria-label="紫色"></button>
            <label class="accent-custom" id="accent-custom" title="自定义颜色">
              <input type="color" id="accent-picker" value="#1d9bf0" aria-label="自定义主题色">
            </label>
          </div>
        </div>

      </div>

      <!-- 喜欢列表面板 -->
      <div class="me-subview" id="likes-panel">
        <div class="likes-head">
          <div class="likes-topbar">
            <button class="me-back" id="me-likes-back" type="button" aria-label="返回">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
            <span class="likes-top-title" id="likes-top-title">我的喜欢</span>
          </div>
          <div class="likes-filter" id="likes-filter" role="tablist" aria-label="喜欢内容分类"></div>
        </div>
        <div id="likes-list"></div>
      </div>
    </section>

    <!-- 听听：随机弹唱音频流 -->
    <section id="listen-view" class="view">
      <div id="listen-list"></div>
      <div id="listen-sentinel" style="height:1px;"></div>
    </section>
  </main>

  <!-- 回到顶部 -->
  <button class="scroll-top-btn" id="scroll-top-btn" aria-label="回到顶部">
    <span class="scroll-icon"></span>
  </button>

  <!-- 底部 Tab 栏 -->
  <nav id="tab-bar">
    <button class="tab active" data-tab="feed">
      <span class="tab-icon"></span>
      <span class="tab-label" id="tab-label-feed">首页</span>
    </button>
    <button class="tab" data-tab="listen">
      <span class="tab-icon"></span>
      <span class="tab-label" id="tab-label-listen">听听</span>
    </button>
    <button class="tab" data-tab="me">
      <span class="tab-icon"></span>
      <span class="tab-label" id="tab-label-me">我的</span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="starter-content.js"></script>
  <script src="content-buffer.js"></script>
  <script>
    // ===================== 存储管理 =====================
    const Store = {
      // 喜欢列表：完整内容快照 { id, type, index, duanzi, ts }，按喜欢时间倒序
      getLikes() { return JSON.parse(localStorage.getItem('duanzi_liked') || '[]'); },
      saveLikes(arr) { localStorage.setItem('duanzi_liked', JSON.stringify(arr)); },
      // 浏览历史按分类隔离，在同一浏览器里用于过滤已展示内容。
      getSeen(type) { return JSON.parse(localStorage.getItem(`duanzi_seen_v3_${type}`) || '[]'); },
      saveSeen(type, arr) { localStorage.setItem(`duanzi_seen_v3_${type}`, JSON.stringify(arr.slice(-10000))); },
      getFontSize() { return parseInt(localStorage.getItem('duanzi_fontsize')) || 17; },
      saveFontSize(size) { localStorage.setItem('duanzi_fontsize', size); },
      // 字体：auto=跟随主题，其余为 FONTS 中的 key
      getFontPref() { return localStorage.getItem('duanzi_font_pref') || 'auto'; },
      saveFontPref(key) { localStorage.setItem('duanzi_font_pref', key); },
      // 自定义主题色：空串=跟随主题
      getAccent() { return (localStorage.getItem('duanzi_accent') || '').trim(); },
      saveAccent(hex) { localStorage.setItem('duanzi_accent', hex || ''); },
      getTheme() {
        // 默认纯黑；v2 key 版本化（旧偏好重置一次，让所有人落到黑色默认）
        const theme = localStorage.getItem('duanzi_theme_v2');
        return ['light', 'dark', 'fun', 'paper'].includes(theme) ? theme : 'dark';
      },
      saveTheme(theme) { localStorage.setItem('duanzi_theme_v2', theme); },
      // 当前选中的内容分类
      getCategory() { return localStorage.getItem('duanzi_category') || 'duanzi'; },
      saveCategory(type) { localStorage.setItem('duanzi_category', type); },

      isLiked(id) { return this.getLikes().some(item => item.id === id); },

      // 喜欢：写入完整快照并置顶；取消：移除
      addLike(joke) {
        let likes = this.getLikes().filter(item => item.id !== joke.id);
        likes.unshift({ id: joke.id, type: joke.type, index: joke.index, duanzi: joke.duanzi, ts: Date.now() });
        if (likes.length > 500) likes = likes.slice(0, 500);
        this.saveLikes(likes);
        return true;
      },
      removeLike(id) {
        this.saveLikes(this.getLikes().filter(item => item.id !== id));
        return false;
      },

      addSeen(type, index) {
        const seen = this.getSeen(type);
        if (!seen.includes(index)) {
          seen.push(index);
          this.saveSeen(type, seen);
        }
      },


      // ====== 音频收藏（听听频道）：完整快照，独立存储 ======
      // 注意：音频链接带时效签名，收藏快照仅近期可直接播放，过期需重新刷取
      getAudioLikes() { return JSON.parse(localStorage.getItem('duanzi_liked_audio') || '[]').map(item => ({...item,id:String(item.id).replace(/^cy:cont_/, 'cy:')})); },
      saveAudioLikes(arr) { localStorage.setItem('duanzi_liked_audio', JSON.stringify(arr.slice(0, 300))); },
      isAudioLiked(id) { return this.getAudioLikes().some(x => x.id === id); },
      addAudioLike(item) {
        const arr = this.getAudioLikes().filter(x => x.id !== item.id);
        arr.unshift(Object.assign({}, item, { ts: Date.now() }));
        this.saveAudioLikes(arr);
        return true;
      },
      removeAudioLike(id) {
        this.saveAudioLikes(this.getAudioLikes().filter(x => x.id !== id));
        return false;
      },

      // ====== 内容缓存池（按分类隔离，预加载的核心） ======
      cacheKey(type) { return `duanzi_cache_v3_${type}`; },
      getCache(type) { return JSON.parse(localStorage.getItem(this.cacheKey(type)) || '[]'); },
      saveCache(type, arr) { localStorage.setItem(this.cacheKey(type), JSON.stringify(arr)); },
      // 从缓存池取出一条（API 本身随机返回，直接取队首即可）
      popFromCache(type) {
        const cache = this.getCache(type);
        if (cache.length === 0) return null;
        const joke = cache.shift();
        this.saveCache(type, cache);
        return joke;
      },
      // 批量写入缓存池（去重后直接追加，保持 API 的随机顺序）
      addToCache(type, jokes) {
        let cache = this.getCache(type);
        const existing = new Set(cache.map(j => j.index));
        jokes.forEach(j => {
          if (!existing.has(j.index)) {
            cache.push({ index: j.index, duanzi: j.duanzi });
            existing.add(j.index);
          }
        });
        // 限制缓存上限 300 条
        if (cache.length > 300) cache = cache.slice(-300);
        this.saveCache(type, cache);
      },
      getCacheCount(type) { return this.getCache(type).length; }
    };

    // ===================== 内容分类 =====================
    // 统一数据结构：{ id: `${type}:${index}`, type, index, duanzi }
    const CATEGORIES = [
      { key: 'duanzi', path: 'duanzi', label: '搞笑段子', contentField: 'duanzi' },
      { key: 'dad-joke', path: 'dad-joke', label: '冷笑话', contentField: 'content' },
      { key: 'hitokoto', path: 'hitokoto', label: '一言', contentField: 'hitokoto' }
    ];
    const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));

    // ===================== 字体预设（差异尽量大，手写体优先本地楷体兜底） =====================
    const SANS_STACK = '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Roboto, sans-serif';
    const FONTS = [
      { key: 'heiti',  name: '黑体',   stack: SANS_STACK },
      { key: 'songti', name: '宋体',   stack: 'Georgia, "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif' },
      { key: 'kaiti',  name: '楷体手写', stack: '"Kaiti SC", "STKaiti", "BiauKai", "DFKai-SB", "KaiTi", "楷体", cursive' },
      { key: 'yuanti', name: '圆体',   stack: '"Yuanti SC", "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Microsoft YaHei", "PingFang SC", sans-serif' },
      { key: 'kuaile', name: '萌趣体', stack: '"ZCOOL KuaiLe", "Yuanti SC", "Hiragino Maru Gothic ProN", "Microsoft YaHei", sans-serif' },
      { key: 'mashan', name: '毛笔手写', stack: '"Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", "楷体", cursive' }
    ];
    const FONT_MAP = Object.fromEntries(FONTS.map(f => [f.key, f]));

    // auto：跟随主题（阅读主题用宋体衬线，其余黑体）
    function resolvedFontStack() {
      const pref = Store.getFontPref();
      if (pref === 'auto') return Store.getTheme() === 'paper' ? FONT_MAP.songti.stack : SANS_STACK;
      return (FONT_MAP[pref] || FONT_MAP.heiti).stack;
    }

    function applyFontPref() {
      document.documentElement.style.setProperty('--app-font', resolvedFontStack());
      const current = document.getElementById('font-current');
      if (current) current.textContent = Store.getFontPref() === 'auto' ? '跟随主题' : (FONT_MAP[Store.getFontPref()] || FONT_MAP.heiti).name;
      document.querySelectorAll('.font-opt').forEach(row => {
        const selected = row.dataset.font === Store.getFontPref();
        row.classList.toggle('active', selected);
        row.setAttribute('aria-pressed', String(selected));
      });
    }

    function renderFontOptions() {
      const box = document.getElementById('font-opts');
      if (!box) return;
      const sample = '笑口常开';
      const rows = [
        `<button class="me-row tap font-opt" type="button" data-font="auto">
          <span class="me-label">跟随主题</span>
          <span class="fo-sample" style="font-family:${escapeAttr(SANS_STACK)}">${sample}</span>
          <span class="me-check">✓</span>
        </button>`
      ].concat(FONTS.map(f =>
        `<button class="me-row tap font-opt" type="button" data-font="${f.key}">
          <span class="me-label">${f.name}</span>
          <span class="fo-sample" style="font-family:${escapeAttr(f.stack)}">${sample}</span>
          <span class="me-check">✓</span>
        </button>`
      ));
      box.innerHTML = rows.join('');
      box.querySelectorAll('.font-opt').forEach(row => {
        row.addEventListener('click', () => {
          Store.saveFontPref(row.dataset.font);
          applyFontPref();
          // 字体变化重建卡片，保证已渲染内容立即跟随
          rerenderCards();
        });
      });
      applyFontPref();
    }

    // ===================== 主题色（预设 + 自定义取色器） =====================
    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      const n = parseInt(full, 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    function applyAccent(hex) {
      const root = document.documentElement;
      if (!hex) {
        // 跟随主题：清除行内覆写，交回各主题变量
        root.style.removeProperty('--accent');
        root.style.removeProperty('--accent-soft');
        root.style.removeProperty('--meta-bar-bg');
      } else {
        root.style.setProperty('--accent', hex);
        root.style.setProperty('--accent-soft', hexToRgba(hex, 0.12));
        root.style.setProperty('--meta-bar-bg', hex);
      }
      // 色板选中态
      const cur = (hex || '').toLowerCase();
      document.querySelectorAll('.accent-opt').forEach(btn => {
        const selected = (btn.dataset.accent || '').toLowerCase() === cur;
        btn.classList.toggle('active', selected);
        btn.setAttribute('aria-pressed', String(selected));
      });
      const custom = document.getElementById('accent-custom');
      const picker = document.getElementById('accent-picker');
      if (custom && picker) {
        const isPreset = [...document.querySelectorAll('.accent-opt')].some(b => (b.dataset.accent || '').toLowerCase() === cur);
        custom.classList.toggle('active', !!cur && !isPreset);
        if (cur) {
          picker.value = cur;
          custom.style.background = cur;
        }
      }
    }

    // ===================== 状态 =====================
    let currentTab = 'feed';
    let currentCategory = Store.getCategory();
    let isLoading = false;
    let feedLoadVersion = 0;
    let contentBuffers;
    let feedJokes = [];   // 记录信息流已渲染的内容，用于切换主题时重建
    let fontSize = Store.getFontSize();

    // ===================== 图标（正经 SVG / 整活 emoji 两套） =====================
    const SVG_ICONS = {
      heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      feed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      listen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
      me: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>',
      top: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
      play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
      heartSmall: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>'
    };

    const EMOJI_ICONS = {
      heartOff: '<span class="emoji">🙂</span>',
      heartOn: '<span class="emoji">🤣</span>',
      copy: '<span class="emoji">🎒</span>',
      feed: '<span class="emoji">🤣</span>',
      listen: '<span class="emoji">🎵</span>',
      me: '<span class="emoji">😎</span>',
      likesTrophy: '<span class="emoji">🏆</span>',
      top: '<span class="emoji">👆</span>'
    };

    // ===================== 文案（正经 / 整活两套） =====================
    const COPY = {
      normal: {
        title: '段子手',
        tabFeed: '首页', tabListen: '听听', tabMe: '我的',
        meLikes: '我的喜欢', meCategory: '内容分类', meDisplay: '显示设置',
        meFont: '字号', meFontFace: '字体', meColor: '主题色', meTheme: '主题', likesTitle: '我的喜欢',
        likeLabel: '喜欢', copyLabel: '复制',
        copyOk: '已复制到剪贴板', copyFail: '复制失败，请手动选择',
        fontUp: '字号已放大', fontDown: '字号已缩小',
        loadFail: '加载失败，请重试', retry: '重新加载',
        audioFail: '这个片段打不开，下滑听个新的',
        audioFailLiked: '收藏的片段链接已过期，取消收藏再听首新的吧',
        collectOk: '已收进喜欢',
        emptyTitle: '还没有喜欢的内容', emptyHint: '看到好笑的、听到好听的，点颗红心收起来',
        emptyFilterTitle: '这个分类还没有收藏', emptyFilterHint: '分类下还没有内容，去发现喜欢的吧'
      },
      fun: {
        title: '笑料铺子',
        tabFeed: '开刷', tabListen: '开听', tabMe: '俺的',
        meLikes: '笑话名人堂', meCategory: '整点啥乐子', meDisplay: '看着舒服',
        meFont: '字号大小', meFontFace: '换个笔体', meColor: '加点颜色', meTheme: '换个皮肤', likesTitle: '笑话名人堂',
        likeLabel: '笑哭了', copyLabel: '打包带走',
        copyOk: '打包带走，发朋友圈吧', copyFail: '手滑了，没复制成功',
        fontUp: '字大了，看着不费眼了', fontDown: '字小了，更显文采',
        loadFail: '服务器笑抽了，歇会儿再来', retry: '再试试',
        audioFail: '这位唱一半跑路了，下滑换一个',
        audioFailLiked: '这首老存货链接过期啦，换新的听吧',
        collectOk: '收入囊中，好听就是好歌',
        emptyTitle: '名人堂还空着', emptyHint: '看到好笑的，点颗红心捧它入堂',
        emptyFilterTitle: '这间展室还空着', emptyFilterHint: '还没被请进堂，再去淘换点吧'
      }
    };

    function isFun() { return Store.getTheme() === 'fun'; }
    function t(key) { return (isFun() ? COPY.fun : COPY.normal)[key]; }

    // SVG 的渐变与裁切 ID 按实例唯一，收藏页/信息流可同时出现同一条内容。
    let heartIconSequence = 0;
    function createHeartIcon() {
      const key = `like-heart-${++heartIconSequence}`;
      const path = 'M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z';
      return `<svg class="heart-icon" viewBox="0 0 24 24" aria-hidden="true">
        <defs>
          <linearGradient id="${key}-gradient" x1="0" y1="0" x2="0.65" y2="1">
            <stop offset="0" style="stop-color:var(--heart-top)"/><stop offset="1" style="stop-color:var(--heart-bottom)"/>
          </linearGradient>
          <clipPath id="${key}-clip"><rect class="heart-fill-window" x="0" y="0" width="24" height="24"/></clipPath>
        </defs>
        <path class="heart-outline" d="${path}"/>
        <path d="${path}" fill="url(#${key}-gradient)" clip-path="url(#${key}-clip)"/>
      </svg>`;
    }

    function syncLikeButton(btn, liked) {
      btn.classList.toggle('active', liked);
      btn.setAttribute('aria-pressed', String(liked));
      const label = btn.classList.contains('ap-like') ? (liked ? '取消收藏' : '收藏这首歌') : (liked ? '取消喜欢' : t('likeLabel'));
      btn.setAttribute('aria-label', label);
      btn.title = label;
      const emoji = btn.querySelector('.emoji');
      if (emoji) emoji.textContent = liked ? '🤣' : '🙂';
      if (!liked) stopLikeAnimation(btn);
    }

    // ===================== 卡片渲染 =====================
    function createCard(joke, options = {}) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = joke.id;
      if (options.noAnim) card.classList.add('no-anim');

      const liked = Store.isLiked(joke.id);
      const fun = isFun();

      // 仅喜欢列表显示收藏时间，信息流卡片不显示编号
      const metaHtml = options.timestamp
        ? `<span class="joke-meta">${formatTime(options.timestamp)}</span>`
        : '';

      const likeIcon = fun
        ? (liked ? EMOJI_ICONS.heartOn : EMOJI_ICONS.heartOff)
        : createHeartIcon();
      const copyIcon = fun ? EMOJI_ICONS.copy : SVG_ICONS.copy;

      card.innerHTML = `
        <div class="joke-text">${escapeHtml(joke.duanzi)}</div>
        <div class="card-footer">
          ${metaHtml}
          <div class="actions">
            <button class="action-btn like-btn ${liked ? 'active' : ''}" data-action="like" data-id="${joke.id}" data-type="${joke.type}" data-index="${joke.index}" data-text="${escapeAttr(joke.duanzi)}" aria-label="${t('likeLabel')}" title="${t('likeLabel')}">
              ${likeIcon}
            </button>
            <button class="action-btn copy-btn" data-action="copy" data-text="${escapeAttr(joke.duanzi)}" aria-label="${t('copyLabel')}" title="${t('copyLabel')}">
              ${copyIcon}
            </button>
          </div>
        </div>
      `;
      syncLikeButton(card.querySelector('.like-btn'), liked);
      return card;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatTime(ts) {
      const diff = Date.now() - ts;
      const min = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (min < 1) return '刚刚';
      if (min < 60) return `${min}分钟前`;
      if (hours < 24) return `${hours}小时前`;
      if (days < 7) return `${days}天前`;
      return new Date(ts).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    }

    // ===================== API 调用（多镜像 + 多分类容错） =====================
    const MIRROR_HOSTS = [
      'https://60s.viki.moe',       // 主域名（最快）
      'https://60s-api.viki.moe',   // 子域名备份
      'https://60s.b23.run',        // 社区镜像（较慢但兜底）
    ];
    const useProxy = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    let preferredMirror = 0;
    try { preferredMirror = Math.max(0, MIRROR_HOSTS.indexOf(localStorage.getItem('duanzi_working_mirror'))); } catch {}
    const mirrorCooldown = new Map();

    async function requestContent(path, index) {
      const query = index === undefined ? '' : `?id=${encodeURIComponent(index)}`;
      const hosts = useProxy ? [null] : MIRROR_HOSTS.map((_, offset) => MIRROR_HOSTS[(preferredMirror + offset) % MIRROR_HOSTS.length]);
      let error;
      for (const host of hosts) {
        if (host && (mirrorCooldown.get(host) || 0) > Date.now()) continue;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), 8000);
        try {
          const response = await fetch(host ? `${host}/v2/${path}${query}` : `/api/${path}${query}`, {signal: controller.signal});
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const json = await response.json();
          if (json.code !== 200 || !json.data) throw new Error('接口返回异常');
          if (host) {
            preferredMirror = MIRROR_HOSTS.indexOf(host);
            try { localStorage.setItem('duanzi_working_mirror', host); } catch {}
          }
          return json.data;
        } catch (cause) {
          error = cause;
          if (host) mirrorCooldown.set(host, Date.now() + 30000);
        } finally { clearTimeout(timer); }
      }
      throw error || new Error('接口暂时不可用');
    }

    function normalizeItem(type, data) {
      const content = data[CATEGORY_MAP[type].contentField];
      if (!Number.isInteger(Number(data.index)) || typeof content !== 'string' || !content.trim()) throw new Error('内容格式异常');
      return {id: `${type}:${Number(data.index)}`, type, index: Number(data.index), duanzi: content};
    }

    async function fetchJoke(type, index) {
      return normalizeItem(type, await requestContent(CATEGORY_MAP[type].path, index));
    }

    function initializeContentBuffers() {
      const starter = window.STARTER_CONTENT || {text:{}, audio:[], catalogue:{}, blockedIds:[]};
      contentBuffers = {};
      for (const category of CATEGORIES) {
        contentBuffers[category.key] = new ContentBuffer({
          type: category.key, seeds: starter.text[category.key] || [], catalogue: starter.catalogue[category.key] || [],
          blocked: starter.blockedIds, version: starter.version,
          localOnly: starter.localTextOnly === true,
          fetchOne: index => fetchJoke(category.key, index)
        });
      }
      contentBuffers.audio = new ContentBuffer({type:'audio', seeds:starter.audio || [], blocked:starter.blockedIds, version:starter.version, fetchOne:fetchChangya});
    }

    // 有项目预置内容或浏览器缓存时，先显示，再后台补充。
    async function loadMoreJokes(force = false) {
      if (isLoading || currentTab !== 'feed') return;
      isLoading = true;
      const type = currentCategory, version = feedLoadVersion;
      const buffer = contentBuffers[type];
      try {
        if (!buffer.available) {
          showFeedLoading();
          await buffer.waitForFirst({force});
        }
        if (version !== feedLoadVersion || type !== currentCategory) return;
        const jokes = buffer.take(5);
        if (!jokes.length) {
          showFeedLoading();
          showFeedError();
          return;
        }
        const list = document.getElementById('feed-list');
        jokes.forEach(joke => {feedJokes.push(joke);list.appendChild(createCard(joke));});
        hideFeedLoading();
        backgroundPrefetch(type);
      } finally { if (version === feedLoadVersion) isLoading = false; }
    }

    function backgroundPrefetch(type) { return contentBuffers[type].refill(); }

    function showFeedLoading() {
      const existing = document.getElementById('feed-loading');
      if (existing) { existing.classList.remove('error-state'); existing.innerHTML = '<div class="spinner"></div><p>加载中...</p>'; return; }
      const el = document.createElement('div');
      el.id = 'feed-loading';
      el.className = 'state-card';
      el.innerHTML = '<div class="spinner"></div><p>加载中...</p>';
      document.getElementById('feed-list').after(el);
    }

    function hideFeedLoading() {
      const el = document.getElementById('feed-loading');
      if (el) el.remove();
    }

    function showFeedError() {
      const el = document.getElementById('feed-loading');
      if (el) {
        const localOnly = contentBuffers[currentCategory].localOnly;
        el.innerHTML = localOnly ? '<p>这个分类的本地内容已全部展示，可以换个分类继续看</p>' : `<p>暂时没取到新内容，稍后再试</p><button class="retry-btn" onclick="loadMoreJokes(true)">${t('retry')}</button>`;
        el.classList.add('error-state');
      }
    }

    // ===================== 喜欢列表（文字 + 音频混排，按收藏时间倒序，支持分类筛选） =====================
    // 筛选项：all=全部，audio=音乐，duanzi/dad-joke/hitokoto=对应文字分类
    const LIKE_FILTERS = [
      { key: 'all', label: '全部' },
      { key: 'audio', label: '音乐' },
      { key: 'duanzi', label: '段子' },
      { key: 'dad-joke', label: '冷笑话' },
      { key: 'hitokoto', label: '一言' }
    ];
    let likesFilter = 'all';

    function matchLikeFilter(entry, key) {
      if (key === 'all') return true;
      if (key === 'audio') return entry.kind === 'audio';
      return entry.kind === 'text' && entry.data.type === key;
    }

    // 汇总全部喜欢条目（合并 + 时间倒序）
    function collectLikes() {
      const textLikes = Store.getLikes().map(x => ({ kind: 'text', ts: x.ts || 0, data: x }));
      const audioLikes = Store.getAudioLikes().map(x => ({ kind: 'audio', ts: x.ts || 0, data: x }));
      return textLikes.concat(audioLikes).sort((a, b) => b.ts - a.ts);
    }

    // 渲染筛选胶囊（含各分类数量）
    function renderLikesFilter(all) {
      const bar = document.getElementById('likes-filter');
      if (!bar) return;
      bar.innerHTML = LIKE_FILTERS.map(f => {
        const num = all.filter(e => matchLikeFilter(e, f.key)).length;
        return `<button type="button" class="lf-chip ${f.key === likesFilter ? 'active' : ''}" data-filter="${f.key}" role="tab" aria-selected="${f.key === likesFilter}">${f.label}<span class="lf-num">${num}</span></button>`;
      }).join('');
    }

    function renderLikes() {
      const list = document.getElementById('likes-list');

      const all = collectLikes();
      renderLikesFilter(all);

      if (all.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <span>${SVG_ICONS.heart}</span>
            <p>${t('emptyTitle')}</p>
            <p class="hint">${t('emptyHint')}</p>
          </div>
        `;
        updateMeLikesCount();
        return;
      }

      const picked = likesFilter === 'all' ? all : all.filter(e => matchLikeFilter(e, likesFilter));

      if (picked.length === 0) {
        const label = (LIKE_FILTERS.find(f => f.key === likesFilter) || {}).label || '';
        list.innerHTML = `
          <div class="empty-state">
            <span>${SVG_ICONS.heart}</span>
            <p>${t('emptyFilterTitle')}</p>
            <p class="hint">${label}${t('emptyFilterHint')}</p>
          </div>
        `;
        updateMeLikesCount();
        return;
      }

      list.innerHTML = '';
      picked.forEach(entry => {
        if (entry.kind === 'audio') {
          list.appendChild(createAudioCard(entry.data, { noAnim: true }));
        } else {
          // 迁移来的旧收藏没有喜欢时间，不显示时间
          list.appendChild(createCard(entry.data, entry.ts ? { timestamp: entry.ts } : {}));
        }
      });
      updateMeLikesCount();
    }

    // 「我的」页喜欢入口上的数量角标
    function updateMeLikesCount() {
      const el = document.getElementById('me-likes-count');
      if (el) {
        el.textContent = Store.getLikes().length + Store.getAudioLikes().length;
      }
    }

    // 喜欢子页面是否处于打开状态（替代旧的 currentTab === 'likes' 判断）
    function likesPanelOpen() {
      return currentTab === 'me' && document.getElementById('me-view').classList.contains('likes-open');
    }

    // ===================== 听听：随机弹唱音频流 =====================
    // 统一音频结构（唯一归一化入口）：
    // { id, nickname, gender, avatar, songName, singer, lyrics[],
    //   audioUrl, durationSec, likeCount, link, publishAt }

    function normalizeAudio(data) {
      const u = data.user || {};
      const s = data.song || {};
      const a = data.audio || {};
      // HTTPS 页面不允许 http 音频（混合内容拦截），CDN 已确认支持 HTTPS，仅做协议升级
      const toHttps = (u0) => String(u0 || '').trim().replace(/^http:\/\//i, 'https://');
      const link = String(a.link || '').trim();
      const id = 'cy:' + (link.split('/').pop() || toHttps(a.url).slice(-32)).replace(/^cont_/, '');
      return {
        id,
        nickname: String(u.nickname || '匿名唱作人'),
        gender: String(u.gender || ''),
        avatar: toHttps(u.avatar_url),
        songName: String(s.name || '未知歌曲'),
        singer: String(s.singer || ''),
        lyrics: Array.isArray(s.lyrics) ? s.lyrics.map(x => String(x)).filter(Boolean) : [],
        audioUrl: toHttps(a.url),
        durationSec: Math.max(1, Math.round((a.duration || 0) / 1000)),
        likeCount: Number(a.like_count) || 0,
        link,
        publishAt: Number(a.publish_at) || 0
      };
    }

    async function fetchChangya() {
      const data = await requestContent('changya');
      if (!data.audio || !data.audio.url) throw new Error('音频格式异常');
      return {...normalizeAudio(data), cachedAt: Date.now()};
    }

    let audioItems = [];
    let listenLoading = false;
    let listenLoaded = false;

    function fmtDuration(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function fmtCount(n) {
      if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
      return String(n);
    }

    function genderHtml(g) {
      if (g === 'female') return '<span class="au-gender female" title="女生">♀</span>';
      if (g === 'male') return '<span class="au-gender male" title="男生">♂</span>';
      return '';
    }

    function createAudioCard(item, options = {}) {
      const card = document.createElement('div');
      card.className = 'audio-card';
      card.dataset.id = item.id;
      if (options.noAnim) card.classList.add('no-anim');

      const lyricsHtml = item.lyrics.length
        ? `<div class="au-lyrics">${item.lyrics.map(l =>
            `<span class="lyr-line">${escapeHtml(l)}</span>`).join('')}</div>`
        : '';
      const avatarHtml = item.avatar
        ? `<img class="au-avatar" src="${escapeAttr(item.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`
        : '<div class="au-avatar"></div>';
      const singerHtml = item.singer
        ? `<span class="singer">原唱：${escapeHtml(item.singer)}</span>` : '';
      const timeHtml = item.publishAt
        ? `<span class="au-dot">·</span><span class="au-time">${formatTime(item.publishAt)}</span>` : '';

      card.innerHTML = `
        ${avatarHtml}
        <div class="au-main">
          <div class="au-head">
            <span class="au-name">${escapeHtml(item.nickname)}</span>
            ${genderHtml(item.gender)}
            ${timeHtml}
          </div>
          <div class="au-song">《${escapeHtml(item.songName)}》 ${singerHtml}</div>
          ${lyricsHtml}
          <div class="au-player">
            <button class="ap-play" aria-label="播放/暂停">
              <span class="ic-play">${SVG_ICONS.play}</span>
              <span class="ic-pause">${SVG_ICONS.pause}</span>
            </button>
            <div class="ap-mid">
              <input class="ap-range" type="range" min="0" max="${item.durationSec}" value="0" step="1" aria-label="播放进度">
              <div class="ap-times">
                <span class="t-cur">0:00</span>
                <span class="t-dur">${fmtDuration(item.durationSec)}</span>
              </div>
            </div>
          </div>
          <div class="ap-foot">
            <span class="ap-stat">${SVG_ICONS.heartSmall}${fmtCount(item.likeCount)}</span>
            <button class="ap-like ${Store.isAudioLiked(item.id) ? 'active' : ''}" aria-label="收藏这首歌" title="收藏">
              ${createHeartIcon()}
            </button>
          </div>
        </div>
      `;

      // 事件：播放/暂停 + 进度拖动
      const playBtn = card.querySelector('.ap-play');
      const range = card.querySelector('.ap-range');
      playBtn.addEventListener('click', () => Player.toggle(item, card));
      range.addEventListener('input', () => {
        if (Player.currentId !== item.id) return;
        Player.el.currentTime = parseFloat(range.value);
      });

      // 事件：收藏 / 取消收藏（同步该音频在信息流与喜欢页的所有卡片）
      const likeBtn = card.querySelector('.ap-like');
      syncLikeButton(likeBtn, Store.isAudioLiked(item.id));
      likeBtn.addEventListener('click', () => {
        const wasLiked = Store.isAudioLiked(item.id);
        const nowLiked = wasLiked
          ? Store.removeAudioLike(item.id)
          : Store.addAudioLike(item);
        document.querySelectorAll('.audio-card').forEach(c => {
          if (c.dataset.id === item.id) {
            const button = c.querySelector('.ap-like');
            if (button) syncLikeButton(button, nowLiked);
          }
        });
        if (!wasLiked && nowLiked) {
          burstParticles(likeBtn);
          showToast(t('collectOk'));
        }
        // 在喜欢子页面取消收藏：立即从列表移除（播放器不受影响）
        if (likesPanelOpen() && !nowLiked) renderLikes();
      });

      // 若全局播放器正在播这条（主题切换重建场景），恢复 UI 态
      if (Player.currentId === item.id) {
        card.classList.add('playing');
        Player.attachUI(card);
        Player.syncUI();
      }

      return card;
    }

    // ---- 全局唯一播放器（单例：互斥、当前播放项单一事实来源） ----
    const Player = {
      el: null,
      currentId: null,
      currentItem: null,
      currentCard: null,

      ensure() {
        if (this.el) return;
        const el = new Audio();
        el.preload = 'none';
        el.addEventListener('timeupdate', () => this.syncUI());
        el.addEventListener('loadedmetadata', () => {
          if (this.currentCard) {
            const range = this.currentCard.querySelector('.ap-range');
            const dur = this.currentCard.querySelector('.t-dur');
            if (el.duration && isFinite(el.duration)) {
              range.max = Math.round(el.duration);
              dur.textContent = fmtDuration(el.duration);
            }
          }
          this.syncUI();
        });
        el.addEventListener('playing', () => {
          this.currentCard?.classList.remove('buffering');
        });
        el.addEventListener('waiting', () => {
          this.currentCard?.classList.add('buffering');
        });
        el.addEventListener('ended', () => this.reset());
        el.addEventListener('error', () => {
          const inLikes = this.currentCard && !!this.currentCard.closest('#likes-list');
          this.reset();
          showToast(inLikes ? t('audioFailLiked') : t('audioFail'));
        });
        this.el = el;
      },

      // 绑定当前卡片的 UI 引用（重建卡片后重新指向）
      attachUI(card) {
        this.currentCard = card;
      },

      syncUI() {
        const card = this.currentCard;
        if (!card || !this.el) return;
        const item = this.currentItem;
        if (!item) return;
        const range = card.querySelector('.ap-range');
        const cur = card.querySelector('.t-cur');
        const dur = isFinite(this.el.duration) && this.el.duration ? this.el.duration : item.durationSec;
        const pos = this.el.currentTime || 0;
        if (document.activeElement !== range) {
          range.value = Math.round(pos);
        }
        range.style.setProperty('--p', `${(pos / (dur || 1)) * 100}%`);
        cur.textContent = fmtDuration(pos);
      },

      reset() {
        const old = this.currentCard;
        if (old) {
          old.classList.remove('playing', 'buffering');
          const range = old.querySelector('.ap-range');
          const cur = old.querySelector('.t-cur');
          if (range) { range.value = 0; range.style.setProperty('--p', '0%'); }
          if (cur) cur.textContent = '0:00';
        }
        if (this.el) { this.el.pause(); this.el.removeAttribute('src'); this.el.load(); }
        this.currentId = null;
        this.currentItem = null;
        this.currentCard = null;
      },

      async toggle(item, card) {
        this.ensure();
        // 同一条：播放/暂停切换
        if (this.currentId === item.id) {
          if (this.el.paused) {
            card.classList.add('buffering');
            try { await this.el.play(); } catch (e) {}
          } else {
            this.el.pause();
            card.classList.remove('playing');
          }
          return;
        }
        // 切新歌：先复位旧卡片
        const oldCard = this.currentCard;
        if (oldCard && oldCard !== card) {
          oldCard.classList.remove('playing', 'buffering');
          const range = oldCard.querySelector('.ap-range');
          if (range) { range.value = 0; range.style.setProperty('--p', '0%'); }
          const cur = oldCard.querySelector('.t-cur');
          if (cur) cur.textContent = '0:00';
        }
        this.currentId = item.id;
        this.currentItem = item;
        this.currentCard = card;
        this.el.src = item.audioUrl;
        card.classList.add('playing', 'buffering');
        try {
          await this.el.play();
          card.classList.remove('buffering');
        } catch (e) {
          this.reset();
          showToast(t('audioFail'));
        }
      }
    };

    function rerenderAudioCards() {
      const list = document.getElementById('listen-list');
      if (!list || !audioItems.length) return;
      list.innerHTML = '';
      audioItems.forEach(it => list.appendChild(createAudioCard(it, { noAnim: true })));
    }

    async function loadMoreAudio(force = false) {
      if (listenLoading || currentTab !== 'listen') return;
      listenLoading = true;
      const buffer = contentBuffers.audio;
      try {
        if (!buffer.available) {
          showListenLoading();
          await buffer.waitForFirst({force});
        }
        const items = buffer.take(4);
        if (!items.length) {showListenLoading();showListenError();return;}
        const list = document.getElementById('listen-list');
        items.forEach(item => {audioItems.push(item);list.appendChild(createAudioCard(item));});
        listenLoaded = true;
        hideListenLoading();
        backgroundAudioPrefetch();
      } finally { listenLoading = false; }
    }
    function backgroundAudioPrefetch() { return contentBuffers.audio.refill(); }

    function showListenLoading() {
      const existing = document.getElementById('listen-loading');
      if (existing) { existing.classList.remove('error-state'); existing.innerHTML = '<div class="spinner"></div><p>寻找正在唱歌的人...</p>'; return; }
      const el = document.createElement('div');
      el.id = 'listen-loading';
      el.className = 'state-card';
      el.innerHTML = '<div class="spinner"></div><p>寻找正在唱歌的人...</p>';
      document.getElementById('listen-list').after(el);
    }
    function hideListenLoading() {
      document.getElementById('listen-loading')?.remove();
    }
    function showListenError() {
      const el = document.getElementById('listen-loading');
      if (el) {
        el.innerHTML = `<p>暂时没有新的歌声，稍后再试</p><button class="retry-btn" onclick="loadMoreAudio(true)">${t('retry')}</button>`;
        el.classList.add('error-state');
      }
    }

    // ===================== 操作处理 =====================
    function handleAction(e) {
      const btn = e.target.closest('.action-btn');
      if (!btn) return;

      const action = btn.dataset.action;

      if (action === 'like') {
        const id = btn.dataset.id;
        const type = btn.dataset.type;
        const index = parseInt(btn.dataset.index);
        const wasLiked = Store.isLiked(id);
        // 喜欢时保存完整内容快照，取消时移除
        const isNowLiked = wasLiked
          ? Store.removeLike(id)
          : Store.addLike({ id, type, index, duanzi: btn.dataset.text });
        // 更新表情图标 + 同步页面上同一条内容的其他按钮
        document.querySelectorAll('.like-btn').forEach(b => {
          if (b.dataset.id !== id) return;
          syncLikeButton(b, isNowLiked);
        });
        // 仅在「变为喜欢」时触发粒子特效
        if (!wasLiked && isNowLiked) {
          burstParticles(btn);
        }
        // 在喜欢子页面取消喜欢：立即移除该卡片
        if (likesPanelOpen() && !isNowLiked) {
          renderLikes();
        }
      }

      else if (action === 'copy') {
        const text = btn.dataset.text;
        copyText(text);
      }
    }

    // ===================== 小范围点赞回弹与细粒子 =====================
    const likeAnimations = new WeakMap();
    function stopLikeAnimation(btn) {
      const state = likeAnimations.get(btn);
      if (!state) return;
      clearTimeout(state.timer);
      state.animations.forEach(animation => animation.cancel());
      state.overlay.remove();
      likeAnimations.delete(btn);
    }

    function burstParticles(btn) {
      stopLikeAnimation(btn);
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const target = btn.querySelector('.emoji') || btn.querySelector('.heart-icon');
      if (!target || typeof target.animate !== 'function') return;

      // 特效跟随按钮本身，不在整个屏幕上散布粒子。
      const overlay = document.createElement('span');
      overlay.className = 'like-burst';
      overlay.setAttribute('aria-hidden', 'true');
      btn.appendChild(overlay);
      const animations = [];
      animations.push(target.animate([
        { transform: 'scale(1)', offset: 0 },
        { transform: 'scale(.76)', offset: .16 },
        { transform: 'scale(1.22)', offset: .43 },
        { transform: 'scale(.96)', offset: .65 },
        { transform: 'scale(1.05)', offset: .81 },
        { transform: 'scale(1)', offset: 1 }
      ], { duration: 520, easing: 'cubic-bezier(.25,.46,.45,.94)' }));

      const ring = document.createElement('span');
      ring.className = 'like-ring';
      overlay.appendChild(ring);
      animations.push(ring.animate([
        { opacity: 0, transform: 'scale(.65)', offset: 0 },
        { opacity: .6, transform: 'scale(1.05)', offset: .25 },
        { opacity: 0, transform: 'scale(1.9)', offset: 1 }
      ], { duration: 350, easing: 'ease-out' }));

      const colors = ['#ee6596', '#b88bd9', '#ec83a7', '#e9a083', '#a8a5e0', '#85b9cc', '#e67ca3'];
      for (let ray = 0; ray < 7; ray++) {
        for (let pair = 0; pair < 2; pair++) {
          const angle = Math.PI * 2 * ray / 7 - Math.PI / 2 + pair * .15;
          const distance = pair ? 21 : 27;
          const x = Math.cos(angle), y = Math.sin(angle);
          const dot = document.createElement('span');
          dot.className = 'like-speck';
          dot.style.width = dot.style.height = `${pair ? 2 : 3}px`;
          dot.style.background = colors[ray];
          overlay.appendChild(dot);
          const position = radius => `translate(calc(-50% + ${x * radius}px), calc(-50% + ${y * radius}px))`;
          animations.push(dot.animate([
            { opacity: 0, transform: `${position(12)} scale(.4)`, offset: 0 },
            { opacity: .9, transform: `${position(16)} scale(1)`, offset: .18 },
            { opacity: .6, transform: `${position(distance - 3)} scale(.8)`, offset: .65 },
            { opacity: 0, transform: `${position(distance)} scale(.15)`, offset: 1 }
          ], { duration: 400, delay: 100 + pair * 25, easing: 'ease-out' }));
        }
      }
      const timer = setTimeout(() => stopLikeAnimation(btn), 580);
      likeAnimations.set(btn, { overlay, animations, timer });
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(t('copyOk'));
      } catch (e) {
        // 兼容性 fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast(t('copyOk'));
        } catch (err) {
          showToast(t('copyFail'));
        }
        document.body.removeChild(textarea);
      }
    }

    // ===================== Toast =====================
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // ===================== Tab 切换 =====================
    const TABS = ['feed', 'listen', 'me'];

    function switchTab(tab) {
      if (!TABS.includes(tab)) return;
      currentTab = tab;
      document.body.dataset.tab = tab;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

      document.getElementById(`${tab}-view`).classList.add('active');
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

      if (tab === 'me') {
        // 每次进入「我的」都回到菜单根层
        closeLikesPanel();
        updateMeLikesCount();
      }
      if (tab === 'listen' && !listenLoaded && !listenLoading) loadMoreAudio();
      // 在「我的」里切换过分类后，首页需要补载
      if (tab === 'feed' && !document.getElementById('feed-list').children.length) loadMoreJokes();

      // 回到顶部
      window.scrollTo({ top: 0, behavior: 'instant' });
      updateScrollTopBtn();
    }

    // 「我的」内：菜单 ⇄ 喜欢列表
    function openLikesPanel() {
      likesFilter = 'all'; // 每次进入默认「全部」
      document.getElementById('me-view').classList.add('likes-open');
      renderLikes();
      window.scrollTo({ top: 0, behavior: 'instant' });
      updateScrollTopBtn();
    }

    function closeLikesPanel() {
      document.getElementById('me-view').classList.remove('likes-open');
    }

    // ===================== 字号调节 =====================
    function applyFontSize() {
      document.documentElement.style.setProperty('--joke-font-size', fontSize + 'px');
      const v = document.getElementById('font-value');
      if (v) v.textContent = fontSize;
      // 样字按当前真实字号实时渲染
      const c = document.getElementById('fp-char');
      if (c) c.style.fontSize = fontSize + 'px';
      document.getElementById('font-decrease').disabled = fontSize <= 14;
      document.getElementById('font-increase').disabled = fontSize >= 24;
    }

    function changeFontSize(delta) {
      fontSize = Math.max(14, Math.min(24, fontSize + delta));
      Store.saveFontSize(fontSize);
      applyFontSize();
      showToast(delta > 0 ? t('fontUp') : t('fontDown'));
    }

    // ===================== 主题切换（在「我的」页四选一） =====================
    // light / dark / paper = 正经主题（SVG 图标 + 中性文案）
    // fun = 整活主题（emoji 图标 + 浮动表情 + 段子梗文案）
    const THEMES = ['light', 'dark', 'fun', 'paper'];

    const THEME_COLORS = { light: '#ffffff', dark: '#080a0c', fun: '#fff6e6', paper: '#f8f4e9' };

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      // 同步 meta theme-color
      document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_COLORS[theme] || '#000000');
      // 更新随主题变化的图标 / 文案 / 装饰 / 卡片
      applyThemeStyles();
    }

    // 更新主题色板选中态
    function updateThemeOptions(theme) {
      document.querySelectorAll('.theme-opt').forEach(opt => {
        const selected = opt.dataset.theme === theme;
        opt.classList.toggle('active', selected);
        opt.setAttribute('aria-pressed', String(selected));
      });
    }

    function selectTheme(theme) {
      if (!THEMES.includes(theme) || theme === Store.getTheme()) return;
      Store.saveTheme(theme);
      applyTheme(theme);
    }

    // 更新所有随主题变化的静态元素与卡片
    function applyThemeStyles() {
      const fun = isFun();


      // 底部 Tab 图标与文字
      document.querySelector('.tab[data-tab="feed"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.feed : SVG_ICONS.feed;
      document.querySelector('.tab[data-tab="listen"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.listen : SVG_ICONS.listen;
      document.querySelector('.tab[data-tab="me"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.me : SVG_ICONS.me;
      document.getElementById('tab-label-feed').textContent = t('tabFeed');
      document.getElementById('tab-label-listen').textContent = t('tabListen');
      document.getElementById('tab-label-me').textContent = t('tabMe');

      // 「我的」页文案与图标
      document.getElementById('me-likes-label').textContent = t('meLikes');
      document.getElementById('me-likes-icon').innerHTML = fun ? EMOJI_ICONS.likesTrophy : SVG_ICONS.heart;
      document.getElementById('me-cat-title').textContent = t('meCategory');
      document.getElementById('me-display-title').textContent = t('meDisplay');
      document.getElementById('me-font-title').textContent = t('meFont');
      document.getElementById('me-fontface-title').textContent = t('meFontFace');
      document.getElementById('me-color-title').textContent = t('meColor');
      document.getElementById('me-theme-title').textContent = t('meTheme');
      document.getElementById('likes-top-title').textContent = t('likesTitle');
      updateThemeOptions(Store.getTheme());

      // auto 字体随主题变化（阅读主题→宋体）；自定义主题色在换肤后继续生效
      applyFontPref();
      applyAccent(Store.getAccent());

      // 回到顶部按钮
      document.querySelector('#scroll-top-btn .scroll-icon').innerHTML = fun ? EMOJI_ICONS.top : SVG_ICONS.top;


      // 重建已渲染卡片，使图标/文案跟随主题
      rerenderCards();
    }

    // 重建信息流与历史页的卡片（保留滚动位置）
    function rerenderCards() {
      const feedList = document.getElementById('feed-list');
      if (feedList && feedJokes.length) {
        const y = window.scrollY;
        feedList.innerHTML = '';
        feedJokes.forEach(j => feedList.appendChild(createCard(j, { noAnim: true })));
        window.scrollTo({ top: y, behavior: 'instant' });
      }
      if (likesPanelOpen()) renderLikes();
      rerenderAudioCards();
    }

    // ===================== 回到顶部按钮 =====================
    function updateScrollTopBtn() {
      const btn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 400) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    }

    // ===================== 无限滚动 =====================
    function setupInfiniteScroll() {
      const feedObs = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoading && currentTab === 'feed') {
          loadMoreJokes();
        }
      }, { rootMargin: '600px' });
      feedObs.observe(document.getElementById('feed-sentinel'));

      const listenObs = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !listenLoading && currentTab === 'listen') {
          loadMoreAudio();
        }
      }, { rootMargin: '600px' });
      listenObs.observe(document.getElementById('listen-sentinel'));
    }

    // ===================== 旧数据迁移（一次性） =====================
    function migrateData() {
      if (localStorage.getItem('duanzi_migrate_v4')) return;
      try {
        // 喜欢列表升级为带复合 id 的快照
        const rawLikes = localStorage.getItem('duanzi_liked');
        if (rawLikes) {
          const old = JSON.parse(rawLikes);
          if (Array.isArray(old) && old.length && !('id' in old[0])) {
            if (typeof old[0] === 'number') {
              // 更老版本：纯编号数组，从历史/缓存里找回内容
              const contentMap = {};
              ['duanzi_history', 'duanzi_cache_v2', 'duanzi_cache', 'duanzi_cache_v3_duanzi'].forEach(key => {
                try {
                  (JSON.parse(localStorage.getItem(key)) || []).forEach(j => {
                    if (j && j.duanzi && !(j.index in contentMap)) contentMap[j.index] = j.duanzi;
                  });
                } catch (e) {}
              });
              const records = old
                .filter(i => contentMap[i])
                .map(i => ({ id: `duanzi:${i}`, type: 'duanzi', index: i, duanzi: contentMap[i], ts: 0 }));
              localStorage.setItem('duanzi_liked', JSON.stringify(records));
            } else {
              // 上一版：{ index, duanzi, ts }，补齐 id/type（旧内容均属搞笑段子）
              const records = old
                .filter(j => j && j.duanzi)
                .map(j => ({ id: `duanzi:${j.index}`, type: 'duanzi', index: j.index, duanzi: j.duanzi, ts: j.ts || 0 }));
              localStorage.setItem('duanzi_liked', JSON.stringify(records));
            }
          }
        }
        // 旧版已看 / 浏览历史 → 按分类隔离的 v3 key（全部归入搞笑段子）
        const seen = new Set(Store.getSeen('duanzi'));
        try {
          (JSON.parse(localStorage.getItem('duanzi_seen')) || []).forEach(i => seen.add(i));
        } catch (e) {}
        try {
          (JSON.parse(localStorage.getItem('duanzi_history')) || []).forEach(h => seen.add(h.index));
        } catch (e) {}
        if (seen.size) Store.saveSeen('duanzi', [...seen]);
        localStorage.removeItem('duanzi_seen');
        localStorage.removeItem('duanzi_history');
      } catch (e) {}
      localStorage.setItem('duanzi_migrate_v4', '1');
    }

    // ===================== 内容分类切换（在「我的」页选择） =====================
    function renderCategoryUI() {
      document.querySelectorAll('.me-cat').forEach(mi => {
        const selected = mi.dataset.category === currentCategory;
        mi.classList.toggle('active', selected);
        mi.setAttribute('aria-pressed', String(selected));
      });
    }

    function switchCategory(type) {
      if (!CATEGORY_MAP[type] || type === currentCategory) return;
      currentCategory = type;
      Store.saveCategory(type);

      // 重置信息流（各分类缓存/已看独立）
      document.getElementById('feed-list').innerHTML = '';
      feedJokes = [];
      feedLoadVersion++;
      isLoading = false;
      hideFeedLoading();
      renderCategoryUI();
      // 回到首页立刻看到新分类；仍停在「我的」也会在切回首页时补载
      switchTab('feed');
      loadMoreJokes();
    }

    // ===================== 初始化 =====================
    function init() {
      // 旧数据迁移
      migrateData();

      // 初始 Tab 标记（控制顶栏标题显隐）
      document.body.dataset.tab = currentTab;

      // 应用字号
      applyFontSize();

      initializeContentBuffers();
      renderCategoryUI();

      // 事件委托：操作按钮
      document.addEventListener('click', (e) => {
        if (e.target.closest('.action-btn')) {
          handleAction(e);
        }
      });

      // Tab 切换（重复点「我的」= 从喜欢子页面返回菜单根层）
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          if (tab.dataset.tab === 'me' && currentTab === 'me' && likesPanelOpen()) {
            closeLikesPanel();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
          switchTab(tab.dataset.tab);
        });
      });

      // 「我的」：进入 / 返回喜欢列表
      document.getElementById('me-open-likes').addEventListener('click', openLikesPanel);
      document.getElementById('me-likes-back').addEventListener('click', closeLikesPanel);

      // 喜欢列表分类筛选（胶囊会随 renderLikes 重建，用事件委托）
      document.getElementById('likes-filter').addEventListener('click', (e) => {
        const chip = e.target.closest('.lf-chip');
        if (!chip || chip.classList.contains('active')) return;
        likesFilter = chip.dataset.filter;
        renderLikes();
      });

      // 内容分类（我的页内联选择，选中即切回首页）
      document.querySelectorAll('.me-cat').forEach(item => {
        item.addEventListener('click', () => switchCategory(item.dataset.category));
      });

      // 字号调节
      document.getElementById('font-decrease').addEventListener('click', () => changeFontSize(-1));
      document.getElementById('font-increase').addEventListener('click', () => changeFontSize(1));

      // 字体选项（先渲染，applyTheme 时才能同步选中态与 auto 字体栈）
      renderFontOptions();

      // 主题色：预设色板直选
      document.getElementById('accent-opts').addEventListener('click', (e) => {
        const btn = e.target.closest('.accent-opt');
        if (!btn) return;
        const hex = (btn.dataset.accent || '').trim();
        Store.saveAccent(hex);
        applyAccent(hex);
      });
      // 主题色：自定义取色器（拖动即实时预览，松手/确认时值相同无副作用）
      const accentPicker = document.getElementById('accent-picker');
      accentPicker.addEventListener('input', () => {
        Store.saveAccent(accentPicker.value);
        applyAccent(accentPicker.value);
      });

      // 主题：四枚色板直选
      document.querySelectorAll('.theme-opt').forEach(opt => {
        opt.addEventListener('click', () => selectTheme(opt.dataset.theme));
      });
      applyTheme(Store.getTheme());
      updateMeLikesCount();

      // 回到顶部
      document.getElementById('scroll-top-btn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 滚动监听
      window.addEventListener('scroll', updateScrollTopBtn, { passive: true });


      // 无限滚动
      setupInfiniteScroll();

      // 文字直接读取完整本地库；歌曲保留后台补充。
      loadMoreJokes();
      // 缓存阅读页与文字库；相对路径兼容 GitHub Pages 项目子目录。
      if ('serviceWorker' in navigator && window.isSecureContext && /^https?:$/.test(location.protocol)) {
        const cachePage = async () => {
          try {
            await navigator.serviceWorker.register('./offline-worker.js', {updateViaCache:'none'});
            navigator.serviceWorker.addEventListener('controllerchange', () => navigator.serviceWorker.controller?.postMessage('warm-audio'));
            const ready = await navigator.serviceWorker.ready;
            ready.active?.postMessage('warm-audio');
          } catch {}
        };
        if ('requestIdleCallback' in window) requestIdleCallback(cachePage, {timeout:1200});
        else setTimeout(cachePage, 250);
      }
    }

    // DOM 就绪后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
