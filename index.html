<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="刷段子 - 随机搞笑段子信息流">
  <title>笑料铺子 · 刷段子</title>
  <style>
    /* ===== 设计变量：纯白主题（默认，X 风格） ===== */
    :root {
      --bg: #ffffff;
      --bg-elevated: #ffffff;
      --card-bg: #ffffff;
      --text: #0f1419;
      --text-secondary: #536471;
      --text-tertiary: #97a0ab;
      --accent: #1d9bf0;
      --accent-soft: rgba(29, 155, 240, 0.1);
      --like-color: #f91880;
      --like-soft: rgba(249, 24, 128, 0.1);
      --copy-color: #1d9bf0;
      --copy-soft: rgba(29, 155, 240, 0.1);
      --border: #eff3f4;
      --border-light: #f5f7f8;
      --hairline: #eff3f4;
      --header-bg: rgba(255, 255, 255, 0.85);
      --tab-bg: rgba(255, 255, 255, 0.92);
      --toast-bg: rgba(15, 20, 25, 0.92);
      --toast-text: #ffffff;
      --scroll-btn-bg: #ffffff;
      --scroll-btn-shadow: rgba(15, 20, 25, 0.12);
      --meta-bar-bg: #1d9bf0;
      --joke-font-size: 16.5px;
      --radius: 0;
      --header-h: 52px;
      --tab-h: 56px;
      --max-width: 620px;
      --card-px: 18px;
    }

    /* ===== 纯黑主题（Dark，X 的 Light Out） ===== */
    :root[data-theme="dark"] {
      --bg: #000000;
      --bg-elevated: #000000;
      --card-bg: #000000;
      --text: #e7e9ea;
      --text-secondary: #8b98a5;
      --text-tertiary: #566a76;
      --accent: #1d9bf0;
      --accent-soft: rgba(29, 155, 240, 0.1);
      --like-color: #f91880;
      --like-soft: rgba(249, 24, 128, 0.1);
      --copy-color: #1d9bf0;
      --copy-soft: rgba(29, 155, 240, 0.1);
      --border: #2f3336;
      --border-light: #19202a;
      --hairline: #16181c;
      --header-bg: rgba(0, 0, 0, 0.85);
      --tab-bg: rgba(0, 0, 0, 0.92);
      --toast-bg: rgba(231, 233, 234, 0.92);
      --toast-text: #000000;
      --scroll-btn-bg: #000000;
      --scroll-btn-shadow: rgba(0, 0, 0, 0.5);
      --meta-bar-bg: #1d9bf0;
      color-scheme: dark;
    }

    /* ===== 整活主题（幽默风：emoji 图标 + 浮动表情 + 段子梗文案） ===== */
    :root[data-theme="fun"] {
      --bg: #fff6e6;
      --bg-elevated: #fffdf7;
      --card-bg: #fffdf7;
      --text: #2a2019;
      --text-secondary: #8a7866;
      --text-tertiary: #c0ad98;
      --accent: #ff8a3d;
      --accent-soft: rgba(255, 138, 61, 0.12);
      --like-color: #ff5c8a;
      --like-soft: rgba(255, 92, 138, 0.12);
      --copy-color: #3fae8f;
      --copy-soft: rgba(63, 174, 143, 0.12);
      --border: #f0e2cc;
      --border-light: #f7ecd8;
      --hairline: #f2e6d2;
      --header-bg: rgba(255, 246, 230, 0.85);
      --tab-bg: rgba(255, 253, 247, 0.92);
      --toast-bg: rgba(42, 32, 25, 0.92);
      --toast-text: #fffdf7;
      --scroll-btn-bg: #fffdf7;
      --scroll-btn-shadow: rgba(150, 100, 40, 0.16);
      --meta-bar-bg: #ff8a3d;
    }

    /* ===== 仿真阅读主题（复古黄本子：横线纸 + 红色装订线 + 衬线正文） ===== */
    :root[data-theme="paper"] {
      --bg: #e3d5ad;            /* 桌面（纸外）偏深的旧木色 */
      --bg-elevated: #f8f0da;   /* 纸张 */
      --card-bg: transparent;   /* 卡片透明，露出横线纸底 */
      --text: #3a3326;          /* 墨色正文 */
      --text-secondary: #6f6449;
      --text-tertiary: #a79b7c;
      --accent: #355874;        /* 蓝黑墨水 */
      --accent-soft: rgba(53, 88, 116, 0.12);
      --like-color: #b03a2e;    /* 老师红笔 */
      --like-soft: rgba(176, 58, 46, 0.12);
      --copy-color: #355874;
      --copy-soft: rgba(53, 88, 116, 0.12);
      --border: #ddcb9f;
      --border-light: #e7d9b4;
      --hairline: rgba(140, 110, 55, 0.20);  /* 纸边淡线；卡片分割线单独去掉，由横线承担 */
      --header-bg: rgba(248, 240, 218, 0.88);
      --tab-bg: rgba(248, 240, 218, 0.94);
      --toast-bg: rgba(58, 51, 38, 0.94);
      --toast-text: #f8f0da;
      --scroll-btn-bg: #f8f0da;
      --scroll-btn-shadow: rgba(120, 90, 40, 0.22);
      --meta-bar-bg: #b03a2e;
      --paper-line: rgba(70, 100, 140, 0.28);   /* 横线颜色（作业本蓝） */
      --paper-margin: rgba(176, 58, 46, 0.38);   /* 红色装订线 */
      --paper-edge: #d9c79b;
    }

    /* 纸外：旧木桌面 */
    :root[data-theme="paper"] body {
      background: var(--bg);
    }

    /* 中间栏目即一张竖格作业本：横线 + 左侧红色装订线 */
    :root[data-theme="paper"] main {
      background-color: var(--bg-elevated);
      background-image:
        linear-gradient(to right,
          transparent 0, transparent 25px,
          var(--paper-margin) 25px, var(--paper-margin) 26px,
          transparent 26px),
        repeating-linear-gradient(to bottom,
          transparent 0, transparent 33px,
          var(--paper-line) 33px, var(--paper-line) 34px);
      border-left: 1px solid var(--paper-edge);
      border-right: 1px solid var(--paper-edge);
      box-shadow: inset 0 0 70px rgba(140, 105, 45, 0.10);
    }

    /* 正文写在装订线右侧，卡片不再画分割线 */
    :root[data-theme="paper"] .card {
      padding-left: 42px;
      padding-right: 22px;
      border-bottom: none;
    }
    :root[data-theme="paper"] .card:active {
      background: rgba(120, 90, 40, 0.06);
    }

    /* 衬线字体，像印在纸上的文字 */
    :root[data-theme="paper"] .joke-text {
      font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif;
      line-height: 34px;        /* 与横线行距对齐，文字落在横线上方 */
      letter-spacing: 0.02em;
    }

    /* 顶部品牌小字也用衬线，像本子封面的题字 */
    :root[data-theme="paper"] .brand-name {
      font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", serif;
    }

    /* ===== Reset ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0.01em;
      padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    ::selection {
      background: var(--accent-soft);
    }

    /* ===== 顶部导航栏（X 风格：简洁居中） ===== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: var(--header-bg);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 14px;
      padding-top: env(safe-area-inset-top);
      border-bottom: 1px solid var(--hairline);
    }

    /* ===== 左上角：品牌名 + 内容分类切换 ===== */
    .header-left {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .brand-switch {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0;
      background: none;
      border: 0;
      padding: 2px 8px 2px 0;
      margin: 0;
      cursor: pointer;
      border-radius: 8px;
      font-family: inherit;
      text-align: left;
      -webkit-tap-highlight-color: transparent;
    }
    .brand-switch:active { background: var(--accent-soft); }

    .brand-name {
      font-size: 10.5px;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-tertiary);
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .brand-name .dot { color: var(--accent); }

    .category-line {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 15.5px;
      font-weight: 700;
      line-height: 1.3;
      color: var(--text);
      white-space: nowrap;
    }
    .category-emoji { font-size: 14px; line-height: 1; }
    .category-caret {
      width: 13px;
      height: 13px;
      color: var(--text-secondary);
      transition: transform 0.2s ease;
    }
    .brand-switch[aria-expanded="true"] .category-caret { transform: rotate(180deg); }

    /* 分类下拉菜单 */
    .category-menu {
      position: absolute;
      top: 100%;
      margin-top: 2px;
      left: 8px;
      min-width: 168px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.16);
      padding: 5px;
      display: none;
      z-index: 200;
    }
    .category-menu.open { display: block; }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 0;
      background: none;
      border-radius: 8px;
      font-size: 14.5px;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      text-align: left;
    }
    .menu-item:active { background: var(--accent-soft); }
    .menu-item .menu-emoji { font-size: 17px; line-height: 1; }
    .menu-item .menu-check {
      margin-left: auto;
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      visibility: hidden;
    }
    .menu-item.active .menu-check { visibility: visible; }

    .seen-badge {
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      background: var(--accent-soft);
      padding: 2px 9px;
      border-radius: 10px;
      margin-left: 8px;
      letter-spacing: 0.02em;
      white-space: nowrap;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }

    .seen-badge .num {
      color: var(--accent);
      font-weight: 700;
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .font-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-weight: 600;
      transition: background 0.15s, transform 0.1s;
    }

    .font-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .font-btn:active {
      transform: scale(0.88);
    }

    .font-btn.small { font-size: 12px; }
    .font-btn.large { font-size: 16px; }

    /* 主题切换按钮 */
    .theme-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      transition: background 0.15s, color 0.15s, transform 0.2s;
      margin-left: 2px;
    }

    .theme-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .theme-btn:active {
      transform: rotate(60deg) scale(0.9);
    }

    .theme-btn svg {
      width: 18px;
      height: 18px;
      transition: transform 0.3s;
    }

    /* ===== 主内容区 ===== */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      min-height: calc(100vh - var(--header-h) - var(--tab-h));
      position: relative;
      z-index: 1;
      border-left: 1px solid var(--hairline);
      border-right: 1px solid var(--hairline);
    }

    .view {
      display: none;
    }

    .view.active {
      display: block;
    }

    /* ===== 段子项（X 风格：无缝分隔线，非卡片） ===== */
    .card {
      padding: 16px var(--card-px);
      border-bottom: 1px solid var(--hairline);
      transition: background 0.15s;
      animation: cardEnter 0.35s ease-out both;
    }

    .card:active {
      background: var(--bg);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    .joke-text {
      font-size: var(--joke-font-size);
      line-height: 1.65;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
      margin-bottom: 10px;
      letter-spacing: 0.005em;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .joke-meta {
      font-size: 12px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      letter-spacing: 0.02em;
      margin-right: auto;
    }

    .actions {
      display: flex;
      gap: 2px;
      margin-left: auto;
    }

    /* X 风格：圆形图标按钮，hover 带色彩背景 */
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--text-tertiary);
      transition: color 0.15s, background 0.15s, transform 0.1s;
      position: relative;
    }

    .action-btn:hover {
      background: var(--copy-soft);
      color: var(--copy-color);
    }

    .action-btn:active {
      transform: scale(0.88);
    }

    .action-btn svg, .action-btn .emoji {
      width: 18.5px;
      height: 18.5px;
      flex-shrink: 0;
    }

    /* 正经主题：SVG 心形图标 */
    .action-btn.like-btn:hover {
      background: var(--like-soft);
      color: var(--like-color);
    }
    .action-btn.like-btn.active {
      color: var(--like-color);
    }
    .action-btn.like-btn.active svg {
      fill: var(--like-color);
      stroke: var(--like-color);
      animation: likeBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 整活主题：emoji 图标 */
    .action-btn .emoji {
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .like-btn .emoji { filter: grayscale(1) opacity(0.5); transition: filter 0.2s, transform 0.2s; }
    .like-btn.active .emoji { filter: grayscale(0); transform: scale(1.15); animation: likeBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .like-btn:active .emoji { transform: scale(0.8); }
    .copy-btn .emoji { filter: grayscale(1) opacity(0.5); transition: filter 0.2s, transform 0.2s; }
    .copy-btn:hover .emoji { filter: grayscale(0) opacity(0.8); }
    .copy-btn:active .emoji { filter: grayscale(0); transform: scale(1.2); }

    /* 主题切换时重建的卡片不重放入场动画 */
    .card.no-anim { animation: none !important; }

    @keyframes likeBounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.5); }
      55% { transform: scale(1.45); }
      80% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    /* ===== X 风格粒子光晕特效 ===== */
    .particle-ring {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 2.5px solid var(--like-color);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      will-change: transform, opacity;
      transform: translate(-50%, -50%) scale(0.2);
    }

    .particle-ring.expand {
      animation: ringExpand 0.8s ease-out forwards;
    }

    @keyframes ringExpand {
      0% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(0.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3);
      }
    }

    .particle {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--like-color);
      box-shadow: 0 0 8px rgba(249, 73, 107, 0.7);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      will-change: transform, opacity;
      transform: translate(-50%, -50%) scale(1);
    }

    .particle.burst {
      animation: particleFly 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes particleFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.2);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .particle, .particle-ring { display: none; }
    }

    /* ===== 加载与错误状态 ===== */
    .state-card {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-tertiary);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .state-card p {
      font-size: 13px;
    }

    .error-state .retry-btn {
      margin-top: 14px;
      padding: 8px 24px;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.1s;
    }

    .error-state .retry-btn:active {
      transform: scale(0.95);
    }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 90px 24px 60px;
      color: var(--text-tertiary);
    }

    .empty-state svg {
      width: 52px;
      height: 52px;
      margin-bottom: 14px;
      color: var(--text-tertiary);
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 15px;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .empty-state .hint {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* ===== 子头部（清空历史等） ===== */
    .sub-header {
      display: flex;
      justify-content: flex-end;
      padding: 10px var(--card-px) 8px;
      border-bottom: 1px solid var(--hairline);
    }

    .clear-btn {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      padding: 6px 14px;
      border-radius: 16px;
      transition: background 0.15s, color 0.15s;
    }

    .clear-btn:hover {
      background: var(--like-soft);
      color: var(--like-color);
    }

    .clear-btn:active {
      transform: scale(0.95);
    }

    /* ===== 底部 Tab 栏 ===== */
    #tab-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      height: var(--tab-h);
      padding-bottom: env(safe-area-inset-bottom);
      background: var(--tab-bg);
      backdrop-filter: saturate(180%) blur(16px);
      -webkit-backdrop-filter: saturate(180%) blur(16px);
      border-top: 1px solid var(--hairline);
      display: flex;
      max-width: var(--max-width);
      margin: 0 auto;
    }

    .tab {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      color: var(--text-tertiary);
      font-size: 13px;
      font-weight: 500;
      transition: color 0.15s;
      letter-spacing: 0.02em;
    }

    .tab .tab-icon {
      width: 21px;
      height: 21px;
      font-size: 18px;
      transition: transform 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tab .tab-icon > svg { width: 21px; height: 21px; }
    .tab .tab-label { white-space: nowrap; }
    .tab.active .tab-icon { transform: scale(1.12); }

    .tab:hover {
      color: var(--accent);
    }

    .tab.active {
      color: var(--text);
      font-weight: 600;
    }

    .tab.active .tab-icon svg {
      stroke: var(--text);
      fill: var(--text);
    }

    /* ===== 听听页：顶部标题 ===== */
    .listen-title {
      display: none;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }
    .listen-title .listen-sub {
      font-weight: 400;
      font-size: 12.5px;
      color: var(--text-secondary);
      margin-left: 5px;
    }
    body[data-tab="listen"] #category-switch,
    body[data-tab="listen"] .seen-badge {
      display: none;
    }
    body[data-tab="listen"] #listen-title {
      display: block;
    }

    /* ===== 听听页：音频卡片（X 风格时间线） ===== */
    .audio-card {
      display: flex;
      gap: 12px;
      padding: 16px var(--card-px);
      border-bottom: 1px solid var(--hairline);
      transition: background 0.15s;
      animation: cardEnter 0.35s ease-out both;
    }
    .audio-card:active {
      background: var(--bg);
    }
    .au-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      flex: none;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .au-main {
      flex: 1;
      min-width: 0;
    }
    .au-head {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      font-size: 14px;
      line-height: 1.35;
    }
    .au-name {
      font-weight: 700;
      color: var(--text);
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .au-gender {
      font-size: 12px;
      line-height: 1;
    }
    .au-gender.female { color: #e0578a; }
    .au-gender.male { color: #3f86d4; }
    .au-dot {
      color: var(--text-tertiary);
      font-size: 12px;
    }
    .au-time {
      color: var(--text-tertiary);
      font-size: 12.5px;
    }
    .au-song {
      margin-top: 3px;
      font-size: 14.5px;
      color: var(--text);
      line-height: 1.45;
    }
    .au-song .singer {
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 400;
    }
    .au-lyrics {
      margin: 9px 0 11px;
      padding: 9px 12px;
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      border-radius: 0 8px 8px 0;
    }
    .au-lyrics .lyr-line {
      display: block;
      font-size: 13.5px;
      line-height: 1.85;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }
    .au-player {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ap-play {
      width: 40px;
      height: 40px;
      flex: none;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.12s, opacity 0.12s;
    }
    .ap-play:active { transform: scale(0.92); }
    .ap-play svg { width: 18px; height: 18px; fill: currentColor; }
    .ap-play .ic-pause { display: none; }
    .audio-card.playing .ap-play .ic-play { display: none; }
    .audio-card.playing .ap-play .ic-pause { display: block; }
    .audio-card.buffering .ap-play svg { opacity: 0.55; }
    .ap-mid {
      flex: 1;
      min-width: 0;
    }
    .ap-range {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      margin: 0;
      background: transparent;
      cursor: pointer;
      display: block;
    }
    .ap-range::-webkit-slider-runnable-track {
      height: 3px;
      border-radius: 2px;
      background: linear-gradient(to right,
        var(--accent) 0%, var(--accent) var(--p, 0%),
        var(--border) var(--p, 0%), var(--border) 100%);
    }
    .ap-range::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 13px;
      height: 13px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: -5px;
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .ap-range::-moz-range-track {
      height: 3px;
      border-radius: 2px;
      background: var(--border);
    }
    .ap-range::-moz-range-progress {
      height: 3px;
      border-radius: 2px;
      background: var(--accent);
    }
    .ap-range::-moz-range-thumb {
      width: 13px;
      height: 13px;
      border: none;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .ap-times {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      margin-top: 1px;
    }
    .ap-times .t-error { color: var(--like-color); }
    .ap-foot {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12.5px;
      color: var(--text-secondary);
    }
    .ap-stat {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .ap-stat svg {
      width: 15px;
      height: 15px;
    }
    .ap-link {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      color: var(--text-secondary);
      text-decoration: none;
    }
    .ap-link svg { width: 14px; height: 14px; }
    .ap-link:active { color: var(--accent); }
    .ap-like {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      color: var(--text-tertiary);
      padding: 4px;
      border-radius: 50%;
      transition: color 0.15s, transform 0.12s;
    }
    .ap-like svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      transition: fill 0.15s;
    }
    .ap-like:active { transform: scale(0.85); }
    .ap-like:hover { color: var(--like-color); }
    .ap-like.active {
      color: var(--like-color);
    }
    .ap-like.active svg {
      fill: var(--like-color);
      stroke: var(--like-color);
    }

    /* 纸张主题：音频卡横线对齐 + 歌词块更像贴在本子上的剪报 */
    :root[data-theme="paper"] .audio-card {
      padding-left: 42px;
      padding-right: 22px;
      border-bottom: none;
    }
    :root[data-theme="paper"] .au-song,
    :root[data-theme="paper"] .au-name {
      font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", serif;
    }

    /* ===== 回到顶部浮动按钮 ===== */
    .scroll-top-btn {
      position: fixed;
      bottom: calc(var(--tab-h) + 14px + env(safe-area-inset-bottom));
      right: 16px;
      z-index: 90;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--scroll-btn-bg);
      box-shadow: 0 2px 12px var(--scroll-btn-shadow), 0 0 0 1px var(--hairline);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      opacity: 0;
      visibility: hidden;
      transform: translateY(10px);
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .scroll-top-btn.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .scroll-top-btn:hover {
      background: var(--accent-soft);
      transform: translateY(-2px);
    }

    .scroll-top-btn:active {
      transform: scale(0.9);
    }

    .scroll-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }
    .scroll-icon > svg {
      width: 19px;
      height: 19px;
    }

    /* ===== Toast 提示 ===== */
    .toast {
      position: fixed;
      bottom: calc(var(--tab-h) + 20px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(16px);
      z-index: 200;
      background: var(--toast-bg);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--toast-text);
      padding: 9px 20px;
      border-radius: 18px;
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    .toast.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* ===== 响应式：桌面端优化 ===== */
    @media (min-width: 641px) {
      body {
        background: var(--bg);
      }
      .scroll-top-btn {
        right: calc(50% - var(--max-width) / 2 + 16px);
      }
    }

    /* ===== 响应式：小屏手机 ===== */
    @media (max-width: 380px) {
      :root {
        --card-px: 14px;
        --joke-font-size: 16px;
      }
      .category-line {
        font-size: 14.5px;
      }
      .seen-badge {
        font-size: 10px;
        padding: 2px 6px;
        margin-left: 4px;
      }
      .tab {
        font-size: 12px;
        gap: 5px;
      }
      .tab .tab-icon {
        font-size: 16px;
      }
      .tab .tab-icon > svg {
        width: 19px;
        height: 19px;
      }
    }

    @media (max-width: 320px) {
      .tab .tab-label {
        display: none;
      }
    }
  </style>
</head>
<body>

  <!-- 顶部导航 -->
  <header>
    <div class="header-left">
      <button class="brand-switch" id="category-switch" aria-haspopup="true" aria-expanded="false" aria-label="选择内容分类">
        <span class="brand-name"><span id="app-title">段子手</span><span class="dot">.</span></span>
        <span class="category-line">
          <span class="category-emoji" id="category-emoji">🤣</span>
          <span id="category-label">搞笑段子</span>
          <svg class="category-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </span>
      </button>
      <span class="seen-badge"><span id="seen-label">已看</span> <span class="num" id="seen-count">0</span><span id="seen-suffix"></span></span>
      <span class="listen-title" id="listen-title">听听<span class="listen-sub" id="listen-title-sub">· 路人弹唱</span></span>
    </div>
    <div class="font-controls">
      <button class="font-btn small" id="font-decrease" title="缩小字体">A</button>
      <button class="font-btn large" id="font-increase" title="放大字体">A</button>
      <button class="theme-btn" id="theme-toggle" title="切换主题" aria-label="切换主题"></button>
    </div>

    <!-- 内容分类下拉菜单 -->
    <div class="category-menu" id="category-menu" role="menu">
      <button class="menu-item" role="menuitemradio" data-category="duanzi">
        <span class="menu-emoji">🤣</span><span>搞笑段子</span><span class="menu-check">✓</span>
      </button>
      <button class="menu-item" role="menuitemradio" data-category="dad-joke">
        <span class="menu-emoji">🧊</span><span>冷笑话</span><span class="menu-check">✓</span>
      </button>
      <button class="menu-item" role="menuitemradio" data-category="hitokoto">
        <span class="menu-emoji">💬</span><span>一言</span><span class="menu-check">✓</span>
      </button>
    </div>
  </header>

  <!-- 主内容区 -->
  <main>
    <!-- 首页信息流 -->
    <section id="feed-view" class="view active">
      <div id="feed-list"></div>
      <div id="feed-sentinel" style="height: 1px;"></div>
    </section>

    <!-- 喜欢列表 -->
    <section id="likes-view" class="view">
      <div class="sub-header" id="likes-sub-header" style="display:none;">
        <button class="clear-btn" id="clear-likes">清空喜欢</button>
      </div>
      <div id="likes-list"></div>
    </section>

    <!-- 听听：随机弹唱音频流 -->
    <section id="listen-view" class="view">
      <div id="listen-list"></div>
      <div id="listen-sentinel" style="height:1px;"></div>
    </section>
  </main>

  <!-- 回到顶部 -->
  <button class="scroll-top-btn" id="scroll-top-btn" aria-label="回到顶部">
    <span class="scroll-icon"></span>
  </button>

  <!-- 底部 Tab 栏 -->
  <nav id="tab-bar">
    <button class="tab active" data-tab="feed">
      <span class="tab-icon"></span>
      <span class="tab-label" id="tab-label-feed">首页</span>
    </button>
    <button class="tab" data-tab="listen">
      <span class="tab-icon"></span>
      <span class="tab-label" id="tab-label-listen">听听</span>
    </button>
    <button class="tab" data-tab="likes">
      <span class="tab-icon"></span>
      <span class="tab-label" id="tab-label-likes">喜欢</span>
    </button>
  </nav>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    // ===================== 存储管理 =====================
    const Store = {
      // 喜欢列表：完整内容快照 { id, type, index, duanzi, ts }，按喜欢时间倒序
      getLikes() { return JSON.parse(localStorage.getItem('duanzi_liked') || '[]'); },
      saveLikes(arr) { localStorage.setItem('duanzi_liked', JSON.stringify(arr)); },
      // 已看编号（按分类隔离，轻量，仅用于当前分类计数与会话去重）
      getSeen(type) { return JSON.parse(localStorage.getItem(`duanzi_seen_v3_${type}`) || '[]'); },
      saveSeen(type, arr) { localStorage.setItem(`duanzi_seen_v3_${type}`, JSON.stringify(arr.slice(-2000))); },
      getFontSize() { return parseInt(localStorage.getItem('duanzi_fontsize')) || 17; },
      saveFontSize(size) { localStorage.setItem('duanzi_fontsize', size); },
      getTheme() {
        // 暖色主题已下线，旧用户迁移到纯白
        const theme = localStorage.getItem('duanzi_theme');
        if (!theme || theme === 'warm') return 'light';
        return theme;
      },
      saveTheme(theme) { localStorage.setItem('duanzi_theme', theme); },
      // 当前选中的内容分类
      getCategory() { return localStorage.getItem('duanzi_category') || 'duanzi'; },
      saveCategory(type) { localStorage.setItem('duanzi_category', type); },

      isLiked(id) { return this.getLikes().some(item => item.id === id); },

      // 喜欢：写入完整快照并置顶；取消：移除
      addLike(joke) {
        let likes = this.getLikes().filter(item => item.id !== joke.id);
        likes.unshift({ id: joke.id, type: joke.type, index: joke.index, duanzi: joke.duanzi, ts: Date.now() });
        if (likes.length > 500) likes = likes.slice(0, 500);
        this.saveLikes(likes);
        return true;
      },
      removeLike(id) {
        this.saveLikes(this.getLikes().filter(item => item.id !== id));
        return false;
      },

      addSeen(type, index) {
        const seen = this.getSeen(type);
        if (!seen.includes(index)) {
          seen.push(index);
          this.saveSeen(type, seen);
        }
      },

      clearLikes() { localStorage.removeItem('duanzi_liked'); },

      // ====== 音频收藏（听听频道）：完整快照，独立存储 ======
      // 注意：音频链接带时效签名，快照中的 audioUrl 过期后可通过 link 回原作品页
      getAudioLikes() { return JSON.parse(localStorage.getItem('duanzi_liked_audio') || '[]'); },
      saveAudioLikes(arr) { localStorage.setItem('duanzi_liked_audio', JSON.stringify(arr.slice(0, 300))); },
      isAudioLiked(id) { return this.getAudioLikes().some(x => x.id === id); },
      addAudioLike(item) {
        const arr = this.getAudioLikes().filter(x => x.id !== item.id);
        arr.unshift(Object.assign({}, item, { ts: Date.now() }));
        this.saveAudioLikes(arr);
        return true;
      },
      removeAudioLike(id) {
        this.saveAudioLikes(this.getAudioLikes().filter(x => x.id !== id));
        return false;
      },
      clearAudioLikes() { localStorage.removeItem('duanzi_liked_audio'); },

      // ====== 内容缓存池（按分类隔离，预加载的核心） ======
      cacheKey(type) { return `duanzi_cache_v3_${type}`; },
      getCache(type) { return JSON.parse(localStorage.getItem(this.cacheKey(type)) || '[]'); },
      saveCache(type, arr) { localStorage.setItem(this.cacheKey(type), JSON.stringify(arr)); },
      // 从缓存池取出一条（API 本身随机返回，直接取队首即可）
      popFromCache(type) {
        const cache = this.getCache(type);
        if (cache.length === 0) return null;
        const joke = cache.shift();
        this.saveCache(type, cache);
        return joke;
      },
      // 批量写入缓存池（去重后直接追加，保持 API 的随机顺序）
      addToCache(type, jokes) {
        let cache = this.getCache(type);
        const existing = new Set(cache.map(j => j.index));
        jokes.forEach(j => {
          if (!existing.has(j.index)) {
            cache.push({ index: j.index, duanzi: j.duanzi });
            existing.add(j.index);
          }
        });
        // 限制缓存上限 300 条
        if (cache.length > 300) cache = cache.slice(-300);
        this.saveCache(type, cache);
      },
      getCacheCount(type) { return this.getCache(type).length; }
    };

    // ===================== 内容分类 =====================
    // 统一数据结构：{ id: `${type}:${index}`, type, index, duanzi }
    const CATEGORIES = [
      {
        key: 'duanzi',
        path: 'duanzi',
        label: '搞笑段子',
        emoji: '🤣',
        contentField: 'duanzi'
      },
      {
        key: 'dad-joke',
        path: 'dad-joke',
        label: '冷笑话',
        emoji: '🧊',
        contentField: 'content'
      },
      {
        key: 'hitokoto',
        path: 'hitokoto',
        label: '一言',
        emoji: '💬',
        contentField: 'hitokoto'
      }
    ];
    const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));

    // ===================== 状态 =====================
    let currentTab = 'feed';
    let currentCategory = Store.getCategory();
    let isLoading = false;
    let seenIndices = new Set();
    let feedJokes = [];   // 记录信息流已渲染的内容，用于切换主题时重建
    let fontSize = Store.getFontSize();

    // ===================== 图标（正经 SVG / 整活 emoji 两套） =====================
    const SVG_ICONS = {
      heart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
      feed: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
      listen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
      likes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      top: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
      play: '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>',
      pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>',
      heartSmall: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>',
      external: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>'
    };

    const EMOJI_ICONS = {
      heartOff: '<span class="emoji">🙂</span>',
      heartOn: '<span class="emoji">🤣</span>',
      copy: '<span class="emoji">🎒</span>',
      feed: '<span class="emoji">🤣</span>',
      listen: '<span class="emoji">🎵</span>',
      likes: '<span class="emoji">🏆</span>',
      top: '<span class="emoji">👆</span>'
    };

    // ===================== 文案（正经 / 整活两套） =====================
    const COPY = {
      normal: {
        title: '段子手', seenLabel: '已看', seenSuffix: '',
        tabFeed: '首页', tabListen: '听听', tabLikes: '喜欢', clear: '清空喜欢',

      },
      fun: {
        title: '笑料铺子', seenLabel: '笑过', seenSuffix: '条',
        tabFeed: '开刷', tabListen: '开听', tabLikes: '笑话名人堂', clear: '都不爱了',
        listenSub: '· 路人开嗓',
        likeLabel: '笑哭了', copyLabel: '打包带走',
        copyOk: '打包带走，发朋友圈吧', copyFail: '手滑了，没复制成功',
        fontUp: '字大了，看着不费眼了', fontDown: '字小了，更显文采',
        clearOk: '行吧，就当没笑过',
        loadFail: '服务器笑抽了，歇会儿再来', retry: '再试试',
        audioFail: '这位唱一半跑路了，下滑换一个',
        audioFailLiked: '这位的链接过期啦，点"原作品"串门去听',
        collectOk: '收入囊中，好听就是好歌',
        emptyTitle: '名人堂还空着', emptyHint: '看到好笑的，点颗红心捧它入堂'
      }
    };

    function isFun() { return Store.getTheme() === 'fun'; }
    function t(key) { return (isFun() ? COPY.fun : COPY.normal)[key]; }

    // ===================== 卡片渲染 =====================
    function createCard(joke, options = {}) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = joke.id;
      if (options.noAnim) card.classList.add('no-anim');

      const liked = Store.isLiked(joke.id);
      const fun = isFun();

      // 仅喜欢列表显示收藏时间，信息流卡片不显示编号
      const metaHtml = options.timestamp
        ? `<span class="joke-meta">${formatTime(options.timestamp)}</span>`
        : '';

      const likeIcon = fun
        ? (liked ? EMOJI_ICONS.heartOn : EMOJI_ICONS.heartOff)
        : SVG_ICONS.heart;
      const copyIcon = fun ? EMOJI_ICONS.copy : SVG_ICONS.copy;

      card.innerHTML = `
        <div class="joke-text">${escapeHtml(joke.duanzi)}</div>
        <div class="card-footer">
          ${metaHtml}
          <div class="actions">
            <button class="action-btn like-btn ${liked ? 'active' : ''}" data-action="like" data-id="${joke.id}" data-type="${joke.type}" data-index="${joke.index}" data-text="${escapeAttr(joke.duanzi)}" aria-label="${t('likeLabel')}" title="${t('likeLabel')}">
              ${likeIcon}
            </button>
            <button class="action-btn copy-btn" data-action="copy" data-text="${escapeAttr(joke.duanzi)}" aria-label="${t('copyLabel')}" title="${t('copyLabel')}">
              ${copyIcon}
            </button>
          </div>
        </div>
      `;

      return card;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatTime(ts) {
      const diff = Date.now() - ts;
      const min = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (min < 1) return '刚刚';
      if (min < 60) return `${min}分钟前`;
      if (hours < 24) return `${hours}小时前`;
      if (days < 7) return `${days}天前`;
      return new Date(ts).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    }

    // ===================== API 调用（多镜像 + 多分类容错） =====================
    const MIRROR_HOSTS = [
      'https://60s.viki.moe',       // 主域名（最快）
      'https://60s-api.viki.moe',   // 子域名备份
      'https://60s.b23.run',        // 社区镜像（较慢但兜底）
    ];
    // 本地开发环境自动使用代理（浏览器无法直连外部 API）
    let useProxy = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    let mirrorIdx = 0; // 当前使用的镜像索引

    // 接口字段归一化：搞笑段子返回 duanzi，冷笑话返回 content，统一成内部结构
    function normalizeItem(type, data) {
      const cat = CATEGORY_MAP[type];
      return {
        id: `${type}:${data.index}`,
        type,
        index: data.index,
        duanzi: data[cat.contentField]
      };
    }

    // 单条请求：从当前镜像获取，失败自动切换下一个镜像
    async function fetchJoke(type) {
      const cat = CATEGORY_MAP[type];
      const url = useProxy ? `/api/${cat.path}` : `${MIRROR_HOSTS[mirrorIdx]}/v2/${cat.path}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API请求失败');
      const json = await res.json();
      if (json.code !== 200 || !json.data) throw new Error('接口返回异常');
      return normalizeItem(type, json.data);
    }

    // 容错获取：尝试所有镜像直到成功
    async function fetchJokeWithFallback(type) {
      // 代理模式直接请求（服务端已做多镜像容错）
      if (useProxy) {
        return await fetchJoke(type);
      }
      // 直连模式：尝试所有镜像
      for (let i = 0; i < MIRROR_HOSTS.length; i++) {
        try {
          mirrorIdx = i;
          return await fetchJoke(type);
        } catch (e) {
          // 尝试下一个镜像
          if (i === MIRROR_HOSTS.length - 1) {
            // 所有镜像都失败，切换到代理模式兜底
            useProxy = true;
            return await fetchJoke(type);
          }
        }
      }
    }

    async function fetchJokes(type, count = 5) {
      const promises = Array.from({ length: count }, () => fetchJokeWithFallback(type));
      return Promise.all(promises);
    }

    // 给缓存池取出的轻量条目补全 id/type（缓存按分类隔离，不含 type 字段）
    function hydrate(type, item) {
      return item ? { id: `${type}:${item.index}`, type, index: item.index, duanzi: item.duanzi } : null;
    }

    // ===================== 首页信息流 =====================
    // 加载策略：优先从当前分类的本地缓存池随机取（毫秒级），缓存不足时才请求 API
    async function loadMoreJokes() {
      if (isLoading || currentTab !== 'feed') return;
      isLoading = true;
      showFeedLoading();

      const type = currentCategory;
      const BATCH_SIZE = 5;
      const CACHE_THRESHOLD = 20; // 缓存低于此值时触发后台补充
      let jokes = [];

      // 1) 优先从本地缓存池取数据（保持 API 返回的随机顺序）
      if (Store.getCacheCount(type) > 0) {
        for (let i = 0; i < BATCH_SIZE; i++) {
          const joke = hydrate(type, Store.popFromCache(type));
          if (joke) jokes.push(joke);
        }
      }

      // 2) 缓存不够，从 API 补充后入缓存池再取
      if (jokes.length < BATCH_SIZE) {
        try {
          const apiJokes = await fetchJokes(type, 15);
          Store.addToCache(type, apiJokes);
          while (jokes.length < BATCH_SIZE) {
            const joke = hydrate(type, Store.popFromCache(type));
            if (!joke) break;
            jokes.push(joke);
          }
        } catch (e) {
          // API 失败但缓存有数据，继续用缓存数据
          if (jokes.length === 0) {
            showFeedError();
            isLoading = false;
            hideFeedLoading();
            return;
          }
        }
      }

      // 3) 渲染卡片（跳过本次会话已展示过的，避免重复）
      const list = document.getElementById('feed-list');
      jokes.forEach(joke => {
        if (!seenIndices.has(joke.id)) {
          seenIndices.add(joke.id);
          Store.addSeen(type, joke.index);
          feedJokes.push(joke);
          const card = createCard(joke);
          list.appendChild(card);
        }
      });
      updateSeenCount();

      isLoading = false;
      hideFeedLoading();

      // 4) 后台预加载：缓存不足时异步补充
      if (Store.getCacheCount(type) < CACHE_THRESHOLD) {
        backgroundPrefetch(type);
      }
    }

    // 后台预加载：不影响 UI 的异步缓存补充（按分类）
    const prefetching = new Set();
    async function backgroundPrefetch(type) {
      if (prefetching.has(type)) return;
      prefetching.add(type);
      try {
        // 每次补充 20 条随机内容到该分类缓存池
        const jokes = await fetchJokes(type, 20);
        Store.addToCache(type, jokes);
      } catch (e) {
        // 静默失败，不影响用户
      } finally {
        prefetching.delete(type);
      }
    }

    // 更新已浏览计数显示
    function updateSeenCount() {
      const el = document.getElementById('seen-count');
      if (el) {
        el.textContent = seenIndices.size;
      }
    }

    function showFeedLoading() {
      const existing = document.getElementById('feed-loading');
      if (existing) return;
      const el = document.createElement('div');
      el.id = 'feed-loading';
      el.className = 'state-card';
      el.innerHTML = '<div class="spinner"></div><p>加载中...</p>';
      document.getElementById('feed-list').after(el);
    }

    function hideFeedLoading() {
      const el = document.getElementById('feed-loading');
      if (el) el.remove();
    }

    function showFeedError() {
      const el = document.getElementById('feed-loading');
      if (el) {
        el.innerHTML = `<p>${t('loadFail')}</p><button class="retry-btn" onclick="loadMoreJokes()">${t('retry')}</button>`;
        el.classList.add('error-state');
      }
    }

    // ===================== 喜欢列表页（文字 + 音频混排，按收藏时间倒序） =====================
    function renderLikes() {
      const list = document.getElementById('likes-list');
      const subHeader = document.getElementById('likes-sub-header');

      const textLikes = Store.getLikes().map(x => ({ kind: 'text', ts: x.ts || 0, data: x }));
      const audioLikes = Store.getAudioLikes().map(x => ({ kind: 'audio', ts: x.ts || 0, data: x }));
      const all = textLikes.concat(audioLikes).sort((a, b) => b.ts - a.ts);

      if (all.length === 0) {
        subHeader.style.display = 'none';
        list.innerHTML = `
          <div class="empty-state">
            <span class="emoji" style="font-size:40px;opacity:0.3;margin-bottom:8px;display:block;">${isFun() ? '🏆' : '🤍'}</span>
            <p>${t('emptyTitle')}</p>
            <p class="hint">${t('emptyHint')}</p>
          </div>
        `;
        return;
      }

      subHeader.style.display = 'flex';
      list.innerHTML = '';
      all.forEach(entry => {
        if (entry.kind === 'audio') {
          list.appendChild(createAudioCard(entry.data, { noAnim: true }));
        } else {
          // 迁移来的旧收藏没有喜欢时间，不显示时间
          list.appendChild(createCard(entry.data, entry.ts ? { timestamp: entry.ts } : {}));
        }
      });
    }

    // ===================== 听听：随机弹唱音频流 =====================
    // 统一音频结构（唯一归一化入口）：
    // { id, nickname, gender, avatar, songName, singer, lyrics[],
    //   audioUrl, durationSec, likeCount, link, publishAt }

    function normalizeAudio(data) {
      const u = data.user || {};
      const s = data.song || {};
      const a = data.audio || {};
      // HTTPS 页面不允许 http 音频（混合内容拦截），CDN 已确认支持 HTTPS，仅做协议升级
      const toHttps = (u0) => String(u0 || '').trim().replace(/^http:\/\//i, 'https://');
      const link = String(a.link || '').trim();
      const id = 'cy:' + (link.split('/').pop() || toHttps(a.url).slice(-32));
      return {
        id,
        nickname: String(u.nickname || '匿名唱作人'),
        gender: String(u.gender || ''),
        avatar: toHttps(u.avatar_url),
        songName: String(s.name || '未知歌曲'),
        singer: String(s.singer || ''),
        lyrics: Array.isArray(s.lyrics) ? s.lyrics.map(x => String(x)).filter(Boolean) : [],
        audioUrl: toHttps(a.url),
        durationSec: Math.max(1, Math.round((a.duration || 0) / 1000)),
        likeCount: Number(a.like_count) || 0,
        link,
        publishAt: Number(a.publish_at) || 0
      };
    }

    async function fetchChangya() {
      const url = useProxy ? '/api/changya' : `${MIRROR_HOSTS[mirrorIdx]}/v2/changya`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API请求失败');
      const json = await res.json();
      if (json.code !== 200 || !json.data || !json.data.audio) throw new Error('接口返回异常');
      return normalizeAudio(json.data);
    }

    async function fetchChangyaWithFallback() {
      if (useProxy) return await fetchChangya();
      for (let i = 0; i < MIRROR_HOSTS.length; i++) {
        try {
          mirrorIdx = i;
          return await fetchChangya();
        } catch (e) {
          if (i === MIRROR_HOSTS.length - 1) {
            useProxy = true;
            return await fetchChangya();
          }
        }
      }
    }

    async function fetchAudios(count) {
      return Promise.all(Array.from({ length: count }, () => fetchChangyaWithFallback()));
    }

    // 入池统一去重：会话已展示的、池内已有的都不收（并发批次可能抽到同一首）
    function pushAudioPool(items) {
      let added = 0;
      items.forEach(it => {
        if (!audioSeen.has(it.id) && !audioPool.some(p => p.id === it.id)) {
          audioPool.push(it);
          added++;
        }
      });
      return added;
    }

    // ---- 音频流状态（仅内存：音频链接带时效签名，不做持久化缓存） ----
    let audioPool = [];
    const audioSeen = new Set();
    let audioItems = [];      // 已渲染条目，主题切换重建用
    let listenLoading = false;
    let listenLoaded = false;

    function fmtDuration(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function fmtCount(n) {
      if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
      return String(n);
    }

    function genderHtml(g) {
      if (g === 'female') return '<span class="au-gender female" title="女生">♀</span>';
      if (g === 'male') return '<span class="au-gender male" title="男生">♂</span>';
      return '';
    }

    function createAudioCard(item, options = {}) {
      const card = document.createElement('div');
      card.className = 'audio-card';
      card.dataset.id = item.id;
      if (options.noAnim) card.classList.add('no-anim');

      const lyricsHtml = item.lyrics.length
        ? `<div class="au-lyrics">${item.lyrics.map(l =>
            `<span class="lyr-line">${escapeHtml(l)}</span>`).join('')}</div>`
        : '';
      const avatarHtml = item.avatar
        ? `<img class="au-avatar" src="${escapeAttr(item.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`
        : '<div class="au-avatar"></div>';
      const singerHtml = item.singer
        ? `<span class="singer">原唱：${escapeHtml(item.singer)}</span>` : '';
      const timeHtml = item.publishAt
        ? `<span class="au-dot">·</span><span class="au-time">${formatTime(item.publishAt)}</span>` : '';
      const linkHtml = item.link
        ? `<a class="ap-link" href="${escapeAttr(item.link)}" target="_blank" rel="noopener noreferrer">${SVG_ICONS.external}原作品</a>` : '';

      card.innerHTML = `
        ${avatarHtml}
        <div class="au-main">
          <div class="au-head">
            <span class="au-name">${escapeHtml(item.nickname)}</span>
            ${genderHtml(item.gender)}
            ${timeHtml}
          </div>
          <div class="au-song">《${escapeHtml(item.songName)}》 ${singerHtml}</div>
          ${lyricsHtml}
          <div class="au-player">
            <button class="ap-play" aria-label="播放/暂停">
              <span class="ic-play">${SVG_ICONS.play}</span>
              <span class="ic-pause">${SVG_ICONS.pause}</span>
            </button>
            <div class="ap-mid">
              <input class="ap-range" type="range" min="0" max="${item.durationSec}" value="0" step="1" aria-label="播放进度">
              <div class="ap-times">
                <span class="t-cur">0:00</span>
                <span class="t-dur">${fmtDuration(item.durationSec)}</span>
              </div>
            </div>
          </div>
          <div class="ap-foot">
            <span class="ap-stat">${SVG_ICONS.heartSmall}${fmtCount(item.likeCount)}</span>
            ${linkHtml}
            <button class="ap-like ${Store.isAudioLiked(item.id) ? 'active' : ''}" aria-label="收藏这首歌" title="收藏">
              ${SVG_ICONS.heartSmall}
            </button>
          </div>
        </div>
      `;

      // 事件：播放/暂停 + 进度拖动
      const playBtn = card.querySelector('.ap-play');
      const range = card.querySelector('.ap-range');
      playBtn.addEventListener('click', () => Player.toggle(item, card));
      range.addEventListener('input', () => {
        if (Player.currentId !== item.id) return;
        Player.el.currentTime = parseFloat(range.value);
      });

      // 事件：收藏 / 取消收藏（同步该音频在信息流与喜欢页的所有卡片）
      const likeBtn = card.querySelector('.ap-like');
      likeBtn.addEventListener('click', () => {
        const wasLiked = Store.isAudioLiked(item.id);
        const nowLiked = wasLiked
          ? Store.removeAudioLike(item.id)
          : Store.addAudioLike(item);
        document.querySelectorAll('.audio-card').forEach(c => {
          if (c.dataset.id === item.id) {
            c.querySelector('.ap-like')?.classList.toggle('active', nowLiked);
          }
        });
        if (!wasLiked && nowLiked) {
          burstParticles(likeBtn);
          showToast(t('collectOk'));
        }
        // 在喜欢页取消收藏：立即从列表移除（播放器不受影响）
        if (currentTab === 'likes' && !nowLiked) renderLikes();
      });

      // 若全局播放器正在播这条（主题切换重建场景），恢复 UI 态
      if (Player.currentId === item.id) {
        card.classList.add('playing');
        Player.attachUI(card);
        Player.syncUI();
      }

      return card;
    }

    // ---- 全局唯一播放器（单例：互斥、当前播放项单一事实来源） ----
    const Player = {
      el: null,
      currentId: null,
      currentItem: null,
      currentCard: null,

      ensure() {
        if (this.el) return;
        const el = new Audio();
        el.preload = 'none';
        el.addEventListener('timeupdate', () => this.syncUI());
        el.addEventListener('loadedmetadata', () => {
          if (this.currentCard) {
            const range = this.currentCard.querySelector('.ap-range');
            const dur = this.currentCard.querySelector('.t-dur');
            if (el.duration && isFinite(el.duration)) {
              range.max = Math.round(el.duration);
              dur.textContent = fmtDuration(el.duration);
            }
          }
          this.syncUI();
        });
        el.addEventListener('playing', () => {
          this.currentCard?.classList.remove('buffering');
        });
        el.addEventListener('waiting', () => {
          this.currentCard?.classList.add('buffering');
        });
        el.addEventListener('ended', () => this.reset());
        el.addEventListener('error', () => {
          const inLikes = this.currentCard && !!this.currentCard.closest('#likes-list');
          this.reset();
          showToast(inLikes ? t('audioFailLiked') : t('audioFail'));
        });
        this.el = el;
      },

      // 绑定当前卡片的 UI 引用（重建卡片后重新指向）
      attachUI(card) {
        this.currentCard = card;
      },

      syncUI() {
        const card = this.currentCard;
        if (!card || !this.el) return;
        const item = this.currentItem;
        if (!item) return;
        const range = card.querySelector('.ap-range');
        const cur = card.querySelector('.t-cur');
        const dur = isFinite(this.el.duration) && this.el.duration ? this.el.duration : item.durationSec;
        const pos = this.el.currentTime || 0;
        if (document.activeElement !== range) {
          range.value = Math.round(pos);
        }
        range.style.setProperty('--p', `${(pos / (dur || 1)) * 100}%`);
        cur.textContent = fmtDuration(pos);
      },

      reset() {
        const old = this.currentCard;
        if (old) {
          old.classList.remove('playing', 'buffering');
          const range = old.querySelector('.ap-range');
          const cur = old.querySelector('.t-cur');
          if (range) { range.value = 0; range.style.setProperty('--p', '0%'); }
          if (cur) cur.textContent = '0:00';
        }
        if (this.el) { this.el.pause(); this.el.removeAttribute('src'); this.el.load(); }
        this.currentId = null;
        this.currentItem = null;
        this.currentCard = null;
      },

      async toggle(item, card) {
        this.ensure();
        // 同一条：播放/暂停切换
        if (this.currentId === item.id) {
          if (this.el.paused) {
            card.classList.add('buffering');
            try { await this.el.play(); } catch (e) {}
          } else {
            this.el.pause();
            card.classList.remove('playing');
          }
          return;
        }
        // 切新歌：先复位旧卡片
        const oldCard = this.currentCard;
        if (oldCard && oldCard !== card) {
          oldCard.classList.remove('playing', 'buffering');
          const range = oldCard.querySelector('.ap-range');
          if (range) { range.value = 0; range.style.setProperty('--p', '0%'); }
          const cur = oldCard.querySelector('.t-cur');
          if (cur) cur.textContent = '0:00';
        }
        this.currentId = item.id;
        this.currentItem = item;
        this.currentCard = card;
        this.el.src = item.audioUrl;
        card.classList.add('playing', 'buffering');
        try {
          await this.el.play();
          card.classList.remove('buffering');
        } catch (e) {
          this.reset();
          showToast(t('audioFail'));
        }
      }
    };

    function rerenderAudioCards() {
      const list = document.getElementById('listen-list');
      if (!list || !audioItems.length) return;
      list.innerHTML = '';
      audioItems.forEach(it => list.appendChild(createAudioCard(it, { noAnim: true })));
    }

    async function loadMoreAudio() {
      if (listenLoading || currentTab !== 'listen') return;
      listenLoading = true;
      showListenLoading();

      const BATCH = 4;
      let picked = [];

      // 1) 内存池取
      while (audioPool.length && picked.length < BATCH) {
        const it = audioPool.shift();
        if (!audioSeen.has(it.id)) picked.push(it);
      }

      // 2) 不足则请求（最多补两轮，滤掉重复随机结果）
      if (picked.length < BATCH) {
        try {
          for (let round = 0; round < 2 && picked.length < BATCH; round++) {
            const batch = await fetchAudios(BATCH * 2);
            pushAudioPool(batch);
            while (audioPool.length && picked.length < BATCH) {
              const it = audioPool.shift();
              if (!audioSeen.has(it.id) && !picked.some(p => p.id === it.id)) picked.push(it);
            }
          }
        } catch (e) {
          if (picked.length === 0 && audioItems.length === 0) {
            showListenError();
            listenLoading = false;
            hideListenLoading();
            return;
          }
        }
      }

      // 3) 渲染（双保险：跳过任何重复 id）
      const list = document.getElementById('listen-list');
      picked.forEach(it => {
        if (audioSeen.has(it.id)) return;
        audioSeen.add(it.id);
        audioItems.push(it);
        list.appendChild(createAudioCard(it));
      });

      listenLoading = false;
      hideListenLoading();
      listenLoaded = true;

      // 4) 池子见底时后台补一批
      if (audioPool.length < 6) backgroundAudioPrefetch();
    }

    const audioPrefetching = { v: false };
    async function backgroundAudioPrefetch() {
      if (audioPrefetching.v) return;
      audioPrefetching.v = true;
      try {
        const batch = await fetchAudios(8);
        pushAudioPool(batch);
      } catch (e) { /* 静默 */ } finally {
        audioPrefetching.v = false;
      }
    }

    function showListenLoading() {
      if (document.getElementById('listen-loading')) return;
      const el = document.createElement('div');
      el.id = 'listen-loading';
      el.className = 'state-card';
      el.innerHTML = '<div class="spinner"></div><p>寻找正在唱歌的人...</p>';
      document.getElementById('listen-list').after(el);
    }
    function hideListenLoading() {
      document.getElementById('listen-loading')?.remove();
    }
    function showListenError() {
      const el = document.getElementById('listen-loading');
      if (el) {
        el.innerHTML = `<p>${t('loadFail')}</p><button class="retry-btn" onclick="loadMoreAudio()">${t('retry')}</button>`;
        el.classList.add('error-state');
      }
    }

    // ===================== 操作处理 =====================
    function handleAction(e) {
      const btn = e.target.closest('.action-btn');
      if (!btn) return;

      const action = btn.dataset.action;

      if (action === 'like') {
        const id = btn.dataset.id;
        const type = btn.dataset.type;
        const index = parseInt(btn.dataset.index);
        const wasLiked = Store.isLiked(id);
        // 喜欢时保存完整内容快照，取消时移除
        const isNowLiked = wasLiked
          ? Store.removeLike(id)
          : Store.addLike({ id, type, index, duanzi: btn.dataset.text });
        btn.classList.toggle('active', isNowLiked);
        // 更新表情图标 + 同步页面上同一条内容的其他按钮
        document.querySelectorAll('.like-btn').forEach(b => {
          if (b.dataset.id !== id) return;
          b.classList.toggle('active', isNowLiked);
          const emoji = b.querySelector('.emoji');
          if (emoji) emoji.textContent = isNowLiked ? '🤣' : '🙂';
        });
        // 仅在「变为喜欢」时触发粒子特效
        if (!wasLiked && isNowLiked) {
          burstParticles(btn);
        }
        // 在喜欢列表页取消喜欢：立即移除该卡片
        if (currentTab === 'likes' && !isNowLiked) {
          renderLikes();
        }
      }

      else if (action === 'copy') {
        const text = btn.dataset.text;
        copyText(text);
      }
    }

    // ===================== X 风格粒子光晕特效（Web Animations API） =====================
    function burstParticles(btn) {
      const target = btn.querySelector('.emoji') || btn.querySelector('svg');
      if (!target) return;

      const rect = target.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const elements = [];

      // 扩散光环
      const ring = document.createElement('div');
      ring.className = 'particle-ring';
      ring.style.left = cx + 'px';
      ring.style.top = cy + 'px';
      document.body.appendChild(ring);
      elements.push(ring);

      ring.animate([
        { opacity: 0.8, transform: 'translate(-50%, -50%) scale(0.3)' },
        { opacity: 0, transform: 'translate(-50%, -50%) scale(3)' }
      ], { duration: 800, easing: 'ease-out', fill: 'forwards' });

      // 生成 8 颗粒子，均匀放射
      const PARTICLE_COUNT = 8;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const angle = (Math.PI * 2 * i) / PARTICLE_COUNT + (Math.random() * 0.3 - 0.15);
        const dist = 32 + Math.random() * 16;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        const size = 9 + Math.random() * 5;

        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        document.body.appendChild(p);
        elements.push(p);

        p.animate([
          { opacity: 1, transform: 'translate(-50%, -50%) scale(1.4)' },
          { opacity: 0.9, transform: `translate(calc(-50% + ${tx * 0.5}px), calc(-50% + ${ty * 0.5}px)) scale(1)`, offset: 0.5 },
          { opacity: 0, transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.3)` }
        ], { duration: 900, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
      }

      // 动画结束后清理 DOM
      setTimeout(() => elements.forEach(el => el.remove()), 1000);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(t('copyOk'));
      } catch (e) {
        // 兼容性 fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast(t('copyOk'));
        } catch (err) {
          showToast(t('copyFail'));
        }
        document.body.removeChild(textarea);
      }
    }

    // ===================== Toast =====================
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // ===================== Tab 切换 =====================
    function switchTab(tab) {
      currentTab = tab;
      document.body.dataset.tab = tab;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

      document.getElementById(`${tab}-view`).classList.add('active');
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

      if (tab === 'likes') renderLikes();
      if (tab === 'listen' && !listenLoaded && !listenLoading) loadMoreAudio();

      // 回到顶部
      window.scrollTo({ top: 0, behavior: 'instant' });
      updateScrollTopBtn();
    }

    // ===================== 字号调节 =====================
    function applyFontSize() {
      document.documentElement.style.setProperty('--joke-font-size', fontSize + 'px');
    }

    function changeFontSize(delta) {
      fontSize = Math.max(14, Math.min(24, fontSize + delta));
      Store.saveFontSize(fontSize);
      applyFontSize();
      showToast(delta > 0 ? t('fontUp') : t('fontDown'));
    }

    // ===================== 主题切换 =====================
    // light / dark / paper = 正经主题（SVG 图标 + 中性文案）
    // fun = 整活主题（emoji 图标 + 浮动表情 + 段子梗文案）
    const THEMES = ['light', 'dark', 'fun', 'paper'];

    const THEME_ICONS = {
      light: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="M4.93 4.93l1.41 1.41"/><path d="M17.66 17.66l1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="M6.34 17.66l-1.41 1.41"/><path d="M19.07 4.93l-1.41 1.41"/></svg>',
      dark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>',
      fun: '<span style="font-size:16px;line-height:1;">🎉</span>',
      paper: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/><line x1="8.5" y1="7.5" x2="16" y2="7.5"/><line x1="8.5" y1="11.5" x2="16" y2="11.5"/></svg>'
    };

    const THEME_NAMES = { light: '纯白', dark: '纯黑', fun: '整活', paper: '仿真阅读' };
    const THEME_COLORS = { light: '#ffffff', dark: '#000000', fun: '#fff6e6', paper: '#f8f0da' };

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      document.getElementById('theme-toggle').innerHTML = THEME_ICONS[theme];
      // 同步 meta theme-color
      document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_COLORS[theme]);
      // 更新随主题变化的图标 / 文案 / 装饰 / 卡片
      applyThemeStyles();
    }

    // 更新所有随主题变化的静态元素与卡片
    function applyThemeStyles() {
      const fun = isFun();

      // 顶部标题与计数
      document.getElementById('app-title').textContent = t('title');
      document.getElementById('seen-label').textContent = t('seenLabel');
      document.getElementById('seen-suffix').textContent = t('seenSuffix');

      // 底部 Tab 图标与文字
      document.querySelector('.tab[data-tab="feed"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.feed : SVG_ICONS.feed;
      document.querySelector('.tab[data-tab="listen"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.listen : SVG_ICONS.listen;
      document.querySelector('.tab[data-tab="likes"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.likes : SVG_ICONS.likes;
      document.getElementById('tab-label-feed').textContent = t('tabFeed');
      document.getElementById('tab-label-listen').textContent = t('tabListen');
      document.getElementById('tab-label-likes').textContent = t('tabLikes');
      document.getElementById('listen-title-sub').textContent = t('listenSub');

      // 回到顶部按钮
      document.querySelector('#scroll-top-btn .scroll-icon').innerHTML = fun ? EMOJI_ICONS.top : SVG_ICONS.top;

      // 清空喜欢按钮
      document.getElementById('clear-likes').textContent = t('clear');

      // 重建已渲染卡片，使图标/文案跟随主题
      rerenderCards();
    }

    // 重建信息流与历史页的卡片（保留滚动位置）
    function rerenderCards() {
      const feedList = document.getElementById('feed-list');
      if (feedList && feedJokes.length) {
        const y = window.scrollY;
        feedList.innerHTML = '';
        feedJokes.forEach(j => feedList.appendChild(createCard(j, { noAnim: true })));
        window.scrollTo({ top: y, behavior: 'instant' });
      }
      if (currentTab === 'likes') renderLikes();
      rerenderAudioCards();
    }

    function cycleTheme() {
      const current = Store.getTheme();
      const idx = THEMES.indexOf(current);
      const next = THEMES[(idx + 1) % THEMES.length];
      Store.saveTheme(next);
      applyTheme(next);
      showToast('主题：' + THEME_NAMES[next]);
    }

    // ===================== 回到顶部按钮 =====================
    function updateScrollTopBtn() {
      const btn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 400) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    }

    // ===================== 无限滚动 =====================
    function setupInfiniteScroll() {
      const feedObs = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoading && currentTab === 'feed') {
          loadMoreJokes();
        }
      }, { rootMargin: '600px' });
      feedObs.observe(document.getElementById('feed-sentinel'));

      const listenObs = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !listenLoading && currentTab === 'listen') {
          loadMoreAudio();
        }
      }, { rootMargin: '600px' });
      listenObs.observe(document.getElementById('listen-sentinel'));
    }

    // ===================== 旧数据迁移（一次性） =====================
    function migrateData() {
      if (localStorage.getItem('duanzi_migrate_v4')) return;
      try {
        // 喜欢列表升级为带复合 id 的快照
        const rawLikes = localStorage.getItem('duanzi_liked');
        if (rawLikes) {
          const old = JSON.parse(rawLikes);
          if (Array.isArray(old) && old.length && !('id' in old[0])) {
            if (typeof old[0] === 'number') {
              // 更老版本：纯编号数组，从历史/缓存里找回内容
              const contentMap = {};
              ['duanzi_history', 'duanzi_cache_v2', 'duanzi_cache', 'duanzi_cache_v3_duanzi'].forEach(key => {
                try {
                  (JSON.parse(localStorage.getItem(key)) || []).forEach(j => {
                    if (j && j.duanzi && !(j.index in contentMap)) contentMap[j.index] = j.duanzi;
                  });
                } catch (e) {}
              });
              const records = old
                .filter(i => contentMap[i])
                .map(i => ({ id: `duanzi:${i}`, type: 'duanzi', index: i, duanzi: contentMap[i], ts: 0 }));
              localStorage.setItem('duanzi_liked', JSON.stringify(records));
            } else {
              // 上一版：{ index, duanzi, ts }，补齐 id/type（旧内容均属搞笑段子）
              const records = old
                .filter(j => j && j.duanzi)
                .map(j => ({ id: `duanzi:${j.index}`, type: 'duanzi', index: j.index, duanzi: j.duanzi, ts: j.ts || 0 }));
              localStorage.setItem('duanzi_liked', JSON.stringify(records));
            }
          }
        }
        // 旧版已看 / 浏览历史 → 按分类隔离的 v3 key（全部归入搞笑段子）
        const seen = new Set(Store.getSeen('duanzi'));
        try {
          (JSON.parse(localStorage.getItem('duanzi_seen')) || []).forEach(i => seen.add(i));
        } catch (e) {}
        try {
          (JSON.parse(localStorage.getItem('duanzi_history')) || []).forEach(h => seen.add(h.index));
        } catch (e) {}
        if (seen.size) Store.saveSeen('duanzi', [...seen]);
        localStorage.removeItem('duanzi_seen');
        localStorage.removeItem('duanzi_history');
      } catch (e) {}
      localStorage.setItem('duanzi_migrate_v4', '1');
    }

    // ===================== 内容分类切换 =====================
    function renderCategoryUI() {
      const cat = CATEGORY_MAP[currentCategory];
      document.getElementById('category-emoji').textContent = cat.emoji;
      document.getElementById('category-label').textContent = cat.label;
      document.querySelectorAll('.menu-item').forEach(mi => {
        mi.classList.toggle('active', mi.dataset.category === currentCategory);
      });
    }

    function setMenuOpen(open) {
      document.getElementById('category-menu').classList.toggle('open', open);
      document.getElementById('category-switch').setAttribute('aria-expanded', open ? 'true' : 'false');
    }

    function switchCategory(type) {
      if (!CATEGORY_MAP[type] || type === currentCategory) return;
      currentCategory = type;
      Store.saveCategory(type);

      // 重置信息流（各分类缓存/已看独立）
      document.getElementById('feed-list').innerHTML = '';
      feedJokes = [];
      seenIndices = new Set(Store.getSeen(type).map(i => `${type}:${i}`));
      isLoading = false;
      hideFeedLoading();
      updateSeenCount();
      renderCategoryUI();
      setMenuOpen(false);
      window.scrollTo({ top: 0 });
      loadMoreJokes();
    }

    // ===================== 初始化 =====================
    function init() {
      // 旧数据迁移
      migrateData();

      // 初始 Tab 标记（控制顶栏标题显隐）
      document.body.dataset.tab = currentTab;

      // 应用字号
      applyFontSize();

      // 恢复当前分类的已看记录（用于计数与会话去重）
      Store.getSeen(currentCategory).forEach(i => seenIndices.add(`${currentCategory}:${i}`));
      updateSeenCount();
      renderCategoryUI();

      // 事件委托：操作按钮
      document.addEventListener('click', (e) => {
        if (e.target.closest('.action-btn')) {
          handleAction(e);
        }
      });

      // Tab 切换
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => switchTab(tab.dataset.tab));
      });

      // 内容分类下拉
      document.getElementById('category-switch').addEventListener('click', (e) => {
        e.stopPropagation();
        const menu = document.getElementById('category-menu');
        setMenuOpen(!menu.classList.contains('open'));
      });
      document.querySelectorAll('.menu-item').forEach(item => {
        item.addEventListener('click', (e) => {
          e.stopPropagation();
          switchCategory(item.dataset.category);
        });
      });
      // 点击菜单外部关闭
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.category-menu') && !e.target.closest('#category-switch')) {
          setMenuOpen(false);
        }
      });

      // 字号调节
      document.getElementById('font-decrease').addEventListener('click', () => changeFontSize(-1));
      document.getElementById('font-increase').addEventListener('click', () => changeFontSize(1));

      // 主题切换
      document.getElementById('theme-toggle').addEventListener('click', cycleTheme);
      applyTheme(Store.getTheme());

      // 回到顶部
      document.getElementById('scroll-top-btn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 滚动监听
      window.addEventListener('scroll', updateScrollTopBtn, { passive: true });

      // 清空喜欢
      document.getElementById('clear-likes').addEventListener('click', () => {
        Store.clearLikes();
        Store.clearAudioLikes();
        // 同步信息流中所有卡片的喜欢按钮状态（含整活主题的 emoji）
        document.querySelectorAll('.like-btn').forEach(b => {
          b.classList.remove('active');
          const em = b.querySelector('.emoji');
          if (em) em.textContent = '🙂';
        });
        // 同步音频卡片收藏按钮
        document.querySelectorAll('.ap-like').forEach(b => b.classList.remove('active'));
        renderLikes();
        showToast(t('clearOk'));
      });

      // 无限滚动
      setupInfiniteScroll();

      // 首次加载：优先秒显本地缓存，不足时自动请求并后台预热
      loadMoreJokes();
    }

    // DOM 就绪后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
