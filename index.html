<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="刷段子 - 随机搞笑段子信息流">
  <title>精神零食</title>
  <!-- 手写 / 萌趣字体（网络字体，加载失败自动回退到系统楷体/圆体） -->
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&display=swap">
  <style>
    /* ===== 设计变量：纯白主题（亮色，X 风格） ===== */
    :root {
      --bg: #ffffff;
      --bg-elevated: #ffffff;
      --card-bg: #ffffff;
      --text: #0f1419;
      --text-secondary: #536471;
      --text-tertiary: #97a0ab;
      --accent: #1d9bf0;
      --accent-soft: rgba(29, 155, 240, 0.1);
      --like-color: #f91880;
      --like-soft: rgba(249, 24, 128, 0.1);
      --copy-color: #1d9bf0;
      --copy-soft: rgba(29, 155, 240, 0.1);
      --border: #eff3f4;
      --border-light: #f5f7f8;
      --hairline: #eff3f4;
      --header-bg: rgba(255, 255, 255, 0.85);
      --tab-bg: rgba(255, 255, 255, 0.92);
      --toast-bg: rgba(15, 20, 25, 0.92);
      --toast-text: #ffffff;
      --scroll-btn-bg: #ffffff;
      --scroll-btn-shadow: rgba(15, 20, 25, 0.12);
      --meta-bar-bg: #1d9bf0;
      --joke-font-size: 16.5px;
      --app-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Roboto, sans-serif;
      --radius: 0;
      --tab-h: 56px;
      --max-width: 620px;
      --card-px: 18px;
    }

    /* ===== 纯黑主题（默认，Dark，X 的 Light Out） ===== */
    :root[data-theme="dark"] {
      --bg: #000000;
      --bg-elevated: #000000;
      --card-bg: #000000;
      --text: #e7e9ea;
      --text-secondary: #8b98a5;
      --text-tertiary: #566a76;
      --accent: #1d9bf0;
      --accent-soft: rgba(29, 155, 240, 0.1);
      --like-color: #f91880;
      --like-soft: rgba(249, 24, 128, 0.1);
      --copy-color: #1d9bf0;
      --copy-soft: rgba(29, 155, 240, 0.1);
      --border: #2f3336;
      --border-light: #19202a;
      --hairline: #16181c;
      --header-bg: rgba(0, 0, 0, 0.85);
      --tab-bg: rgba(0, 0, 0, 0.92);
      --toast-bg: rgba(231, 233, 234, 0.92);
      --toast-text: #000000;
      --scroll-btn-bg: #000000;
      --scroll-btn-shadow: rgba(0, 0, 0, 0.5);
      --meta-bar-bg: #1d9bf0;
      color-scheme: dark;
    }

    /* ===== 整活主题（幽默风：emoji 图标 + 浮动表情 + 段子梗文案） ===== */
    :root[data-theme="fun"] {
      --bg: #fff6e6;
      --bg-elevated: #fffdf7;
      --card-bg: #fffdf7;
      --text: #2a2019;
      --text-secondary: #8a7866;
      --text-tertiary: #c0ad98;
      --accent: #ff8a3d;
      --accent-soft: rgba(255, 138, 61, 0.12);
      --like-color: #ff5c8a;
      --like-soft: rgba(255, 92, 138, 0.12);
      --copy-color: #3fae8f;
      --copy-soft: rgba(63, 174, 143, 0.12);
      --border: #f0e2cc;
      --border-light: #f7ecd8;
      --hairline: #f2e6d2;
      --header-bg: rgba(255, 246, 230, 0.85);
      --tab-bg: rgba(255, 253, 247, 0.92);
      --toast-bg: rgba(42, 32, 25, 0.92);
      --toast-text: #fffdf7;
      --scroll-btn-bg: #fffdf7;
      --scroll-btn-shadow: rgba(150, 100, 40, 0.16);
      --meta-bar-bg: #ff8a3d;
    }

    /* ===== 仿真阅读主题（复古黄本子：横线纸 + 红色装订线 + 衬线正文） ===== */
    :root[data-theme="paper"] {
      --bg: #e3d5ad;            /* 桌面（纸外）偏深的旧木色 */
      --bg-elevated: #f8f0da;   /* 纸张 */
      --card-bg: transparent;   /* 卡片透明，露出横线纸底 */
      --text: #3a3326;          /* 墨色正文 */
      --text-secondary: #6f6449;
      --text-tertiary: #a79b7c;
      --accent: #355874;        /* 蓝黑墨水 */
      --accent-soft: rgba(53, 88, 116, 0.12);
      --like-color: #b03a2e;    /* 老师红笔 */
      --like-soft: rgba(176, 58, 46, 0.12);
      --copy-color: #355874;
      --copy-soft: rgba(53, 88, 116, 0.12);
      --border: #ddcb9f;
      --border-light: #e7d9b4;
      --hairline: rgba(140, 110, 55, 0.20);  /* 纸边淡线；卡片分割线单独去掉，由横线承担 */
      --header-bg: rgba(248, 240, 218, 0.88);
      --tab-bg: rgba(248, 240, 218, 0.94);
      --toast-bg: rgba(58, 51, 38, 0.94);
      --toast-text: #f8f0da;
      --scroll-btn-bg: #f8f0da;
      --scroll-btn-shadow: rgba(120, 90, 40, 0.22);
      --meta-bar-bg: #b03a2e;
      --paper-line: rgba(70, 100, 140, 0.28);   /* 横线颜色（作业本蓝） */
      --paper-margin: rgba(176, 58, 46, 0.38);   /* 红色装订线 */
      --paper-edge: #d9c79b;
    }

    /* 纸外：旧木桌面 */
    :root[data-theme="paper"] body {
      background: var(--bg);
    }

    /* 中间栏目即一张竖格作业本：横线 + 左侧红色装订线 */
    :root[data-theme="paper"] main {
      background-color: var(--bg-elevated);
      background-image:
        linear-gradient(to right,
          transparent 0, transparent 25px,
          var(--paper-margin) 25px, var(--paper-margin) 26px,
          transparent 26px),
        repeating-linear-gradient(to bottom,
          transparent 0, transparent 33px,
          var(--paper-line) 33px, var(--paper-line) 34px);
      border-left: 1px solid var(--paper-edge);
      border-right: 1px solid var(--paper-edge);
      box-shadow: inset 0 0 70px rgba(140, 105, 45, 0.10);
    }

    /* 正文写在装订线右侧，卡片不再画分割线 */
    :root[data-theme="paper"] .card {
      padding-left: 42px;
      padding-right: 22px;
      border-bottom: none;
    }
    :root[data-theme="paper"] .card:active {
      background: rgba(120, 90, 40, 0.06);
    }

    /* 纸张主题：行距对齐横线（字体由 --app-font 统一控制，可选手写体） */
    :root[data-theme="paper"] .joke-text {
      line-height: 34px;        /* 与横线行距对齐，文字落在横线上方 */
      letter-spacing: 0.02em;
    }

    /* ===== Reset ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    * { -webkit-tap-highlight-color: transparent; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--app-font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      letter-spacing: 0.01em;
      padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom));
    }

    button {
      font-family: inherit;
      cursor: pointer;
      border: none;
      background: none;
      color: inherit;
    }

    ::selection {
      background: var(--accent-soft);
    }

    /* 顶部栏已整体移除：页面除底部 Tab 外全部为内容区域 */

    /* 字号 / 主题控件（位于「我的」页） */
    .font-controls {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .font-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
      font-weight: 600;
      transition: background 0.15s, transform 0.1s;
    }

    .font-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .font-btn:active {
      transform: scale(0.88);
    }

    .font-btn.small { font-size: 12px; }
    .font-btn.large { font-size: 16px; }

    .font-value {
      min-width: 26px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-tertiary);
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    /* 字号实时预览：样字按当前字号真实渲染 */
    .font-preview {
      min-width: 34px;
      text-align: center;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
      color: var(--text);
      transition: font-size 0.1s ease;
      user-select: none;
    }
    .font-preview .fp-char { line-height: 1.1; }

    /* 字体选项行：名称用自身字体渲染，所见即所得 */
    .font-opt { width: 100%; }
    .font-opt .fo-sample {
      margin-left: auto;
      font-size: 17px;
      color: var(--text-secondary);
      max-width: 52%;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .font-opt.active .fo-sample { color: var(--text); }
    .font-opt .me-check { margin-left: 10px; }

    /* 主题色板 */
    .accent-opts {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px var(--card-px) 16px;
    }
    .accent-opt {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 1px solid var(--border);
      flex: none;
      transition: transform 0.12s;
      cursor: pointer;
    }
    .accent-opt:active { transform: scale(0.9); }
    .accent-opt.active::after {
      content: '';
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 2px solid var(--text);
    }
    .accent-opt.auto-opt {
      background: conic-gradient(#1d9bf0 0 30%, #ff8a3d 30% 55%, #17bf63 55% 80%, #794bc4 80% 100%);
    }
    /* 自定义取色器：外观与色板一致，点开系统选色 */
    .accent-custom {
      position: relative;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      overflow: hidden;
      border: 1px dashed var(--text-tertiary);
      background: var(--accent);
      flex: none;
      padding: 0;
    }
    .accent-custom.active {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--text);
    }
    .accent-custom input[type="color"] {
      position: absolute;
      inset: -6px;
      width: calc(100% + 12px);
      height: calc(100% + 12px);
      border: 0;
      padding: 0;
      background: none;
      cursor: pointer;
      opacity: 0;
    }
    .accent-custom::before {
      content: '';
      position: absolute;
      inset: 0;
      margin: auto;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      opacity: 0.92;
      pointer-events: none;
    }

    /* ===== 主内容区：铺满全屏，仅预留底部 Tab 高度 ===== */
    main {
      max-width: var(--max-width);
      margin: 0 auto;
      min-height: calc(100vh - var(--tab-h));
      position: relative;
      z-index: 1;
      border-left: 1px solid var(--hairline);
      border-right: 1px solid var(--hairline);
    }

    .view {
      display: none;
      /* 顶部安全区（刘海屏状态栏）：内容不被遮挡 */
      padding-top: env(safe-area-inset-top);
    }

    .view.active {
      display: block;
    }

    /* ===== 段子项（X 风格：无缝分隔线，非卡片） ===== */
    .card {
      padding: 16px var(--card-px);
      border-bottom: 1px solid var(--hairline);
      transition: background 0.15s;
      animation: cardEnter 0.35s ease-out both;
    }

    .card:active {
      background: var(--bg);
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { animation: none; }
    }

    .joke-text {
      font-size: var(--joke-font-size);
      line-height: 1.65;
      color: var(--text);
      word-break: break-word;
      white-space: pre-wrap;
      margin-bottom: 10px;
      letter-spacing: 0.005em;
    }

    .card-footer {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .joke-meta {
      font-size: 12px;
      color: var(--text-tertiary);
      flex-shrink: 0;
      letter-spacing: 0.02em;
      margin-right: auto;
    }

    .actions {
      display: flex;
      gap: 2px;
      margin-left: auto;
    }

    /* X 风格：圆形图标按钮，hover 带色彩背景 */
    .action-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      color: var(--text-tertiary);
      transition: color 0.15s, background 0.15s, transform 0.1s;
      position: relative;
    }

    .action-btn:hover {
      background: var(--copy-soft);
      color: var(--copy-color);
    }

    .action-btn:active {
      transform: scale(0.88);
    }

    .action-btn svg, .action-btn .emoji {
      width: 18.5px;
      height: 18.5px;
      flex-shrink: 0;
    }

    /* 正经主题：SVG 心形图标 */
    .action-btn.like-btn:hover {
      background: var(--like-soft);
      color: var(--like-color);
    }
    .action-btn.like-btn.active {
      color: var(--like-color);
    }
    .action-btn.like-btn.active svg {
      fill: var(--like-color);
      stroke: var(--like-color);
      animation: likeBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 整活主题：emoji 图标 */
    .action-btn .emoji {
      font-size: 16px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .like-btn .emoji { filter: grayscale(1) opacity(0.5); transition: filter 0.2s, transform 0.2s; }
    .like-btn.active .emoji { filter: grayscale(0); transform: scale(1.15); animation: likeBounce 0.45s cubic-bezier(0.34, 1.56, 0.64, 1); }
    .like-btn:active .emoji { transform: scale(0.8); }
    .copy-btn .emoji { filter: grayscale(1) opacity(0.5); transition: filter 0.2s, transform 0.2s; }
    .copy-btn:hover .emoji { filter: grayscale(0) opacity(0.8); }
    .copy-btn:active .emoji { filter: grayscale(0); transform: scale(1.2); }

    /* 主题切换时重建的卡片不重放入场动画 */
    .card.no-anim { animation: none !important; }

    @keyframes likeBounce {
      0% { transform: scale(1); }
      30% { transform: scale(0.5); }
      55% { transform: scale(1.45); }
      80% { transform: scale(0.92); }
      100% { transform: scale(1); }
    }

    /* ===== X 风格粒子光晕特效 ===== */
    .particle-ring {
      position: fixed;
      width: 40px;
      height: 40px;
      border: 2.5px solid var(--like-color);
      border-radius: 50%;
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      will-change: transform, opacity;
      transform: translate(-50%, -50%) scale(0.2);
    }

    .particle-ring.expand {
      animation: ringExpand 0.8s ease-out forwards;
    }

    @keyframes ringExpand {
      0% {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(0.2);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(3);
      }
    }

    .particle {
      position: fixed;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--like-color);
      box-shadow: 0 0 8px rgba(249, 73, 107, 0.7);
      opacity: 0;
      pointer-events: none;
      z-index: 9999;
      will-change: transform, opacity;
      transform: translate(-50%, -50%) scale(1);
    }

    .particle.burst {
      animation: particleFly 0.9s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes particleFly {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1.3);
      }
      50% {
        opacity: 0.9;
      }
      100% {
        opacity: 0;
        transform: translate(calc(-50% + var(--tx)), calc(-50% + var(--ty))) scale(0.2);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .particle, .particle-ring { display: none; }
    }

    /* ===== 加载与错误状态 ===== */
    .state-card {
      text-align: center;
      padding: 36px 20px;
      color: var(--text-tertiary);
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 10px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .state-card p {
      font-size: 13px;
    }

    .error-state .retry-btn {
      margin-top: 14px;
      padding: 8px 24px;
      border-radius: 18px;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      transition: transform 0.1s;
    }

    .error-state .retry-btn:active {
      transform: scale(0.95);
    }

    /* ===== 空状态 ===== */
    .empty-state {
      text-align: center;
      padding: 90px 24px 60px;
      color: var(--text-tertiary);
    }

    .empty-state svg {
      width: 52px;
      height: 52px;
      margin-bottom: 14px;
      color: var(--text-tertiary);
      opacity: 0.5;
    }

    .empty-state p {
      font-size: 15px;
      margin-bottom: 6px;
      color: var(--text-secondary);
    }

    .empty-state .hint {
      font-size: 13px;
      color: var(--text-tertiary);
    }

    /* ===== 「我的」页 ===== */
    .me-group {
      border-bottom: 1px solid var(--hairline);
    }

    .me-group-title {
      padding: 15px var(--card-px) 2px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-tertiary);
      letter-spacing: 0.03em;
    }

    .me-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 13px var(--card-px);
      min-height: 52px;
      text-align: left;
      font-size: 15px;
      color: var(--text);
      transition: background 0.15s;
    }

    .me-row:active {
      background: var(--bg);
    }

    .me-row.tap:active {
      background: var(--accent-soft);
    }

    .me-ico {
      width: 22px;
      height: 22px;
      flex: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-secondary);
    }
    .me-ico svg { width: 19px; height: 19px; }
    .me-ico .emoji { font-size: 18px; line-height: 1; }

    .me-label {
      font-size: 15px;
      color: var(--text);
      white-space: nowrap;
    }

    .me-side {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13.5px;
      color: var(--text-secondary);
    }

    .me-badge {
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }

    .me-chevron {
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      flex: none;
    }
    .me-chevron svg { width: 16px; height: 16px; }

    .me-check {
      margin-left: auto;
      color: var(--accent);
      font-weight: 700;
      font-size: 14px;
      visibility: hidden;
    }
    .me-row.active .me-check { visibility: visible; }

    /* 主题选择：四枚色板直选 */
    .theme-opts {
      display: flex;
      gap: 18px;
      padding: 10px var(--card-px) 16px;
    }
    .theme-opt {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-tertiary);
      transition: color 0.15s;
    }
    .theme-opt .theme-dot {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--dot-bg, #fff);
      border: 1px solid var(--border);
      box-shadow: 0 0 0 0 var(--accent);
      transition: box-shadow 0.15s, transform 0.12s;
    }
    .theme-opt:active .theme-dot { transform: scale(0.9); }
    .theme-opt.active { color: var(--text); font-weight: 600; }
    .theme-opt.active .theme-dot {
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
    }

    /* 喜欢子页面：吸顶头部（返回 + 标题 + 清空 + 分类筛选） */
    .likes-head {
      position: sticky;
      top: 0;
      z-index: 20;
      background: var(--header-bg);

      getFontSize() { return parseInt(localStorage.getItem('duanzi_fontsize')) || 17; },
      saveFontSize(size) { localStorage.setItem('duanzi_fontsize', size); },
      // 字体：auto=跟随主题，其余为 FONTS 中的 key
      getFontPref() { return localStorage.getItem('duanzi_font_pref') || 'auto'; },
      saveFontPref(key) { localStorage.setItem('duanzi_font_pref', key); },
      // 自定义主题色：空串=跟随主题
      getAccent() { return (localStorage.getItem('duanzi_accent') || '').trim(); },
      saveAccent(hex) { localStorage.setItem('duanzi_accent', hex || ''); },
      getTheme() {
        // 默认纯黑；v2 key 版本化（旧偏好重置一次，让所有人落到黑色默认）
        const theme = localStorage.getItem('duanzi_theme_v2');
        return ['light', 'dark', 'fun', 'paper'].includes(theme) ? theme : 'dark';
      },
      saveTheme(theme) { localStorage.setItem('duanzi_theme_v2', theme); },
      // 当前选中的内容分类
      getCategory() { return localStorage.getItem('duanzi_category') || 'duanzi'; },
      saveCategory(type) { localStorage.setItem('duanzi_category', type); },

      isLiked(id) { return this.getLikes().some(item => item.id === id); },

      // 喜欢：写入完整快照并置顶；取消：移除
      addLike(joke) {
        let likes = this.getLikes().filter(item => item.id !== joke.id);
        likes.unshift({ id: joke.id, type: joke.type, index: joke.index, duanzi: joke.duanzi, ts: Date.now() });
        if (likes.length > 500) likes = likes.slice(0, 500);
        this.saveLikes(likes);
        return true;
      },
      removeLike(id) {
        this.saveLikes(this.getLikes().filter(item => item.id !== id));
        return false;
      },

      addSeen(type, index) {
        const seen = this.getSeen(type);
        if (!seen.includes(index)) {
          seen.push(index);
          this.saveSeen(type, seen);
        }
      },

      clearLikes() { localStorage.removeItem('duanzi_liked'); },

      // ====== 音频收藏（听听频道）：完整快照，独立存储 ======
      // 注意：音频链接带时效签名，收藏快照仅近期可直接播放，过期需重新刷取
      getAudioLikes() { return JSON.parse(localStorage.getItem('duanzi_liked_audio') || '[]'); },
      saveAudioLikes(arr) { localStorage.setItem('duanzi_liked_audio', JSON.stringify(arr.slice(0, 300))); },
      isAudioLiked(id) { return this.getAudioLikes().some(x => x.id === id); },
      addAudioLike(item) {
        const arr = this.getAudioLikes().filter(x => x.id !== item.id);
        arr.unshift(Object.assign({}, item, { ts: Date.now() }));
        this.saveAudioLikes(arr);
        return true;
      },
      removeAudioLike(id) {
        this.saveAudioLikes(this.getAudioLikes().filter(x => x.id !== id));
        return false;
      },
      clearAudioLikes() { localStorage.removeItem('duanzi_liked_audio'); },

      // ====== 内容缓存池（按分类隔离，预加载的核心） ======
      cacheKey(type) { return `duanzi_cache_v3_${type}`; },
      getCache(type) { return JSON.parse(localStorage.getItem(this.cacheKey(type)) || '[]'); },
      saveCache(type, arr) { localStorage.setItem(this.cacheKey(type), JSON.stringify(arr)); },
      // 从缓存池取出一条（API 本身随机返回，直接取队首即可）
      popFromCache(type) {
        const cache = this.getCache(type);
        if (cache.length === 0) return null;
        const joke = cache.shift();
        this.saveCache(type, cache);
        return joke;
      },
      // 批量写入缓存池（去重后直接追加，保持 API 的随机顺序）
      addToCache(type, jokes) {
        let cache = this.getCache(type);
        const existing = new Set(cache.map(j => j.index));
        jokes.forEach(j => {
          if (!existing.has(j.index)) {
            cache.push({ index: j.index, duanzi: j.duanzi });
            existing.add(j.index);
          }
        });
        // 限制缓存上限 300 条
        if (cache.length > 300) cache = cache.slice(-300);
        this.saveCache(type, cache);
      },
      getCacheCount(type) { return this.getCache(type).length; }
    };

    // ===================== 内容分类 =====================
    // 统一数据结构：{ id: `${type}:${index}`, type, index, duanzi }
    const CATEGORIES = [
      { key: 'duanzi', path: 'duanzi', label: '搞笑段子', contentField: 'duanzi' },
      { key: 'dad-joke', path: 'dad-joke', label: '冷笑话', contentField: 'content' },
      { key: 'hitokoto', path: 'hitokoto', label: '一言', contentField: 'hitokoto' }
    ];
    const CATEGORY_MAP = Object.fromEntries(CATEGORIES.map(c => [c.key, c]));

    // ===================== 字体预设（差异尽量大，手写体优先本地楷体兜底） =====================
    const SANS_STACK = '-apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", Roboto, sans-serif';
    const FONTS = [
      { key: 'heiti',  name: '黑体',   stack: SANS_STACK },
      { key: 'songti', name: '宋体',   stack: 'Georgia, "Songti SC", "STSong", "Noto Serif SC", "Source Han Serif SC", "SimSun", serif' },
      { key: 'kaiti',  name: '楷体手写', stack: '"Kaiti SC", "STKaiti", "BiauKai", "DFKai-SB", "KaiTi", "楷体", cursive' },
      { key: 'yuanti', name: '圆体',   stack: '"Yuanti SC", "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Microsoft YaHei", "PingFang SC", sans-serif' },
      { key: 'kuaile', name: '萌趣体', stack: '"ZCOOL KuaiLe", "Yuanti SC", "Hiragino Maru Gothic ProN", "Microsoft YaHei", sans-serif' },
      { key: 'mashan', name: '毛笔手写', stack: '"Ma Shan Zheng", "Kaiti SC", "STKaiti", "KaiTi", "楷体", cursive' }
    ];
    const FONT_MAP = Object.fromEntries(FONTS.map(f => [f.key, f]));

    // auto：跟随主题（阅读主题用宋体衬线，其余黑体）
    function resolvedFontStack() {
      const pref = Store.getFontPref();
      if (pref === 'auto') return Store.getTheme() === 'paper' ? FONT_MAP.songti.stack : SANS_STACK;
      return (FONT_MAP[pref] || FONT_MAP.heiti).stack;
    }

    function applyFontPref() {
      document.documentElement.style.setProperty('--app-font', resolvedFontStack());
      document.querySelectorAll('.font-opt').forEach(row => {
        row.classList.toggle('active', row.dataset.font === Store.getFontPref());
      });
    }

    function renderFontOptions() {
      const box = document.getElementById('font-opts');
      if (!box) return;

          <span class="me-check">✓</span>
        </button>`
      ].concat(FONTS.map(f =>
        `<button class="me-row tap font-opt" type="button" data-font="${f.key}">
          <span class="me-label">${f.name}</span>
          <span class="fo-sample" style="font-family:${f.stack}">${sample}</span>
          <span class="me-check">✓</span>
        </button>`

      box.querySelectorAll('.font-opt').forEach(row => {
        row.addEventListener('click', () => {
          Store.saveFontPref(row.dataset.font);
          applyFontPref();
          // 字体变化重建卡片，保证已渲染内容立即跟随
          rerenderCards();
        });

      applyFontPref();
    }

    // ===================== 主题色（预设 + 自定义取色器） =====================
    function hexToRgba(hex, alpha) {
      const h = hex.replace('#', '');
      const full = h.length === 3 ? h.split('').map(c => c + c).join('') : h;
      const n = parseInt(full, 16);
      return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${alpha})`;
    }

    function applyAccent(hex) {
      const root = document.documentElement;
      if (!hex) {
        // 跟随主题：清除行内覆写，交回各主题变量
        root.style.removeProperty('--accent');
        root.style.removeProperty('--accent-soft');
        root.style.removeProperty('--meta-bar-bg');
      } else {
        root.style.setProperty('--accent', hex);
        root.style.setProperty('--accent-soft', hexToRgba(hex, 0.12));
        root.style.setProperty('--meta-bar-bg', hex);
      }
      // 色板选中态
      const cur = (hex || '').toLowerCase();
      document.querySelectorAll('.accent-opt').forEach(btn => {
        btn.classList.toggle('active', (btn.dataset.accent || '').toLowerCase() === cur);
      });
      const custom = document.getElementById('accent-custom');
      const picker = document.getElementById('accent-picker');
      if (custom && picker) {
        const isPreset = [...document.querySelectorAll('.accent-opt')].some(b => (b.dataset.accent || '').toLowerCase() === cur);
        custom.classList.toggle('active', !!cur && !isPreset);
        if (cur) {
          picker.value = cur;
          custom.style.background = cur;
        }
      }
    }

    // ===================== 状态 =====================
    let currentTab = 'feed';

    let isLoading = false;

    let feedJokes = [];   // 记录信息流已渲染的内容，用于切换主题时重建
    let fontSize = Store.getFontSize();

    // ===================== 文案（正经 / 整活两套） =====================
    const COPY = {

        emptyTitle: '名人堂还空着', emptyHint: '看到好笑的，点颗红心捧它入堂',

      }

    function isFun() { return Store.getTheme() === 'fun'; }
    function t(key) { return (isFun() ? COPY.fun : COPY.normal)[key]; }

    // ===================== 卡片渲染 =====================
    function createCard(joke, options = {}) {
      const card = document.createElement('div');
      card.className = 'card';
      card.dataset.id = joke.id;
      if (options.noAnim) card.classList.add('no-anim');

      const liked = Store.isLiked(joke.id);
      const fun = isFun();

      // 仅喜欢列表显示收藏时间，信息流卡片不显示编号
      const metaHtml = options.timestamp
        ? `<span class="joke-meta">${formatTime(options.timestamp)}</span>`
        : '';

      const likeIcon = fun
        ? (liked ? EMOJI_ICONS.heartOn : EMOJI_ICONS.heartOff)
        : SVG_ICONS.heart;
      const copyIcon = fun ? EMOJI_ICONS.copy : SVG_ICONS.copy;

      card.innerHTML = `
        <div class="joke-text">${escapeHtml(joke.duanzi)}</div>
        <div class="card-footer">
          ${metaHtml}
          <div class="actions">
            <button class="action-btn like-btn ${liked ? 'active' : ''}" data-action="like" data-id="${joke.id}" data-type="${joke.type}" data-index="${joke.index}" data-text="${escapeAttr(joke.duanzi)}" aria-label="${t('likeLabel')}" title="${t('likeLabel')}">
              ${likeIcon}
            </button>
            <button class="action-btn copy-btn" data-action="copy" data-text="${escapeAttr(joke.duanzi)}" aria-label="${t('copyLabel')}" title="${t('copyLabel')}">
              ${copyIcon}
            </button>
          </div>
        </div>
      `;

      return card;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function escapeAttr(text) {
      return text.replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function formatTime(ts) {
      const diff = Date.now() - ts;
      const min = Math.floor(diff / 60000);
      const hours = Math.floor(diff / 3600000);
      const days = Math.floor(diff / 86400000);
      if (min < 1) return '刚刚';
      if (min < 60) return `${min}分钟前`;
      if (hours < 24) return `${hours}小时前`;
      if (days < 7) return `${days}天前`;
      return new Date(ts).toLocaleDateString('zh-CN', { month: 'short', day: 'numeric' });
    }

    // ===================== API 调用（多镜像 + 多分类容错） =====================
    const MIRROR_HOSTS = [
      'https://60s.viki.moe',       // 主域名（最快）
      'https://60s-api.viki.moe',   // 子域名备份
      'https://60s.b23.run',        // 社区镜像（较慢但兜底）
    ];
    // 本地开发环境自动使用代理（浏览器无法直连外部 API）
    let useProxy = location.hostname === 'localhost' || location.hostname === '127.0.0.1';
    let mirrorIdx = 0; // 当前使用的镜像索引

    // 接口字段归一化：搞笑段子返回 duanzi，冷笑话返回 content，统一成内部结构
    function normalizeItem(type, data) {
      const cat = CATEGORY_MAP[type];
      return {
        id: `${type}:${data.index}`,
        type,
        index: data.index,
        duanzi: data[cat.contentField]
      };
    }

    // 单条请求：从当前镜像获取，失败自动切换下一个镜像
    async function fetchJoke(type) {
      const cat = CATEGORY_MAP[type];
      const url = useProxy ? `/api/${cat.path}` : `${MIRROR_HOSTS[mirrorIdx]}/v2/${cat.path}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API请求失败');
      const json = await res.json();
      if (json.code !== 200 || !json.data) throw new Error('接口返回异常');
      return normalizeItem(type, json.data);
    }

    // 容错获取：尝试所有镜像直到成功
    async function fetchJokeWithFallback(type) {
      // 代理模式直接请求（服务端已做多镜像容错）
      if (useProxy) {
        return await fetchJoke(type);
      }
      // 直连模式：尝试所有镜像
      for (let i = 0; i < MIRROR_HOSTS.length; i++) {
        try {
          mirrorIdx = i;
          return await fetchJoke(type);
        } catch (e) {
          // 尝试下一个镜像
          if (i === MIRROR_HOSTS.length - 1) {
            // 所有镜像都失败，切换到代理模式兜底
            useProxy = true;
            return await fetchJoke(type);
          }
        }
      }
    }

    async function fetchJokes(type, count = 5) {
      const promises = Array.from({ length: count }, () => fetchJokeWithFallback(type));
      return Promise.all(promises);
    }

    // 给缓存池取出的轻量条目补全 id/type（缓存按分类隔离，不含 type 字段）
    function hydrate(type, item) {
      return item ? { id: `${type}:${item.index}`, type, index: item.index, duanzi: item.duanzi } : null;
    }

    // ===================== 首页信息流 =====================
    // 加载策略：优先从当前分类的本地缓存池随机取（毫秒级），缓存不足时才请求 API
    async function loadMoreJokes() {
      if (isLoading || currentTab !== 'feed') return;
      isLoading = true;
      showFeedLoading();

      const type = currentCategory;
      const BATCH_SIZE = 5;
      const CACHE_THRESHOLD = 20; // 缓存低于此值时触发后台补充
      let jokes = [];

      // 1) 优先从本地缓存池取数据（保持 API 返回的随机顺序）
      if (Store.getCacheCount(type) > 0) {
        for (let i = 0; i < BATCH_SIZE; i++) {
          const joke = hydrate(type, Store.popFromCache(type));
          if (joke) jokes.push(joke);
        }
      }

      // 2) 缓存不够，从 API 补充后入缓存池再取
      if (jokes.length < BATCH_SIZE) {
        try {
          const apiJokes = await fetchJokes(type, 15);
          Store.addToCache(type, apiJokes);
          while (jokes.length < BATCH_SIZE) {
            const joke = hydrate(type, Store.popFromCache(type));
            if (!joke) break;
            jokes.push(joke);
          }
        } catch (e) {
          // API 失败但缓存有数据，继续用缓存数据
          if (jokes.length === 0) {
            showFeedError();
            isLoading = false;
            hideFeedLoading();
            return;
          }
        }
      }

      // 3) 渲染卡片（跳过本次会话已展示过的，避免重复）
      const list = document.getElementById('feed-list');
      jokes.forEach(joke => {
        if (!seenIndices.has(joke.id)) {
          seenIndices.add(joke.id);
          Store.addSeen(type, joke.index);
          feedJokes.push(joke);
          const card = createCard(joke);
          list.appendChild(card);
        }
      });
      updateSeenCount();

      isLoading = false;
      hideFeedLoading();

      // 4) 后台预加载：缓存不足时异步补充
      if (Store.getCacheCount(type) < CACHE_THRESHOLD) {
        backgroundPrefetch(type);
      }
    }

    // 后台预加载：不影响 UI 的异步缓存补充（按分类）
    const prefetching = new Set();
    async function backgroundPrefetch(type) {
      if (prefetching.has(type)) return;
      prefetching.add(type);
      try {
        // 每次补充 20 条随机内容到该分类缓存池
        const jokes = await fetchJokes(type, 20);
        Store.addToCache(type, jokes);
      } catch (e) {
        // 静默失败，不影响用户
      } finally {
        prefetching.delete(type);
      }
    }

    // 更新已浏览计数显示
    function updateSeenCount() {
      const el = document.getElementById('seen-count');
      if (el) {
        el.textContent = seenIndices.size;
      }
    }

    function showFeedLoading() {
      const existing = document.getElementById('feed-loading');
      if (existing) return;
      const el = document.createElement('div');
      el.id = 'feed-loading';
      el.className = 'state-card';
      el.innerHTML = '<div class="spinner"></div><p>加载中...</p>';
      document.getElementById('feed-list').after(el);
    }

    function hideFeedLoading() {
      const el = document.getElementById('feed-loading');
      if (el) el.remove();
    }

    function showFeedError() {
      const el = document.getElementById('feed-loading');
      if (el) {
        el.innerHTML = `<p>${t('loadFail')}</p><button class="retry-btn" onclick="loadMoreJokes()">${t('retry')}</button>`;
        el.classList.add('error-state');
      }
    }

    // ===================== 喜欢列表（文字 + 音频混排，按收藏时间倒序，支持分类筛选） =====================
    // 筛选项：all=全部，audio=音乐，duanzi/dad-joke/hitokoto=对应文字分类
    const LIKE_FILTERS = [
      { key: 'all', label: '全部' },
      { key: 'audio', label: '音乐' },
      { key: 'duanzi', label: '段子' },
      { key: 'dad-joke', label: '冷笑话' },
      { key: 'hitokoto', label: '一言' }
    ];
    let likesFilter = 'all';

    function matchLikeFilter(entry, key) {
      if (key === 'all') return true;
      if (key === 'audio') return entry.kind === 'audio';
      return entry.kind === 'text' && entry.data.type === key;
    }

    // 汇总全部喜欢条目（合并 + 时间倒序）
    function collectLikes() {
      const textLikes = Store.getLikes().map(x => ({ kind: 'text', ts: x.ts || 0, data: x }));
      const audioLikes = Store.getAudioLikes().map(x => ({ kind: 'audio', ts: x.ts || 0, data: x }));
      return textLikes.concat(audioLikes).sort((a, b) => b.ts - a.ts);
    }

    // 渲染筛选胶囊（含各分类数量）
    function renderLikesFilter(all) {
      const bar = document.getElementById('likes-filter');
      if (!bar) return;
      bar.innerHTML = LIKE_FILTERS.map(f => {
        const num = all.filter(e => matchLikeFilter(e, f.key)).length;
        return `<button type="button" class="lf-chip ${f.key === likesFilter ? 'active' : ''}" data-filter="${f.key}" role="tab" aria-selected="${f.key === likesFilter}">${f.label}<span class="lf-num">${num}</span></button>`;
      }).join('');
    }

    function renderLikes() {
      const list = document.getElementById('likes-list');
      const clearBtn = document.getElementById('clear-likes');

      const all = collectLikes();
      renderLikesFilter(all);

      if (all.length === 0) {
        clearBtn.style.display = 'none';
        list.innerHTML = `
          <div class="empty-state">
            <span>${SVG_ICONS.heart}</span>
            <p>${t('emptyTitle')}</p>
            <p class="hint">${t('emptyHint')}</p>
          </div>
        `;
        updateMeLikesCount();
        return;
      }

      clearBtn.style.display = '';
      const picked = likesFilter === 'all' ? all : all.filter(e => matchLikeFilter(e, likesFilter));

      if (picked.length === 0) {
        const label = (LIKE_FILTERS.find(f => f.key === likesFilter) || {}).label || '';
        list.innerHTML = `
          <div class="empty-state">
            <span>${SVG_ICONS.heart}</span>
            <p>${t('emptyFilterTitle')}</p>
            <p class="hint">${label}${t('emptyFilterHint')}</p>
          </div>
        `;
        updateMeLikesCount();
        return;
      }

      list.innerHTML = '';
      picked.forEach(entry => {
        if (entry.kind === 'audio') {
          list.appendChild(createAudioCard(entry.data, { noAnim: true }));
        } else {
          // 迁移来的旧收藏没有喜欢时间，不显示时间
          list.appendChild(createCard(entry.data, entry.ts ? { timestamp: entry.ts } : {}));
        }
      });
      updateMeLikesCount();
    }

    // 「我的」页喜欢入口上的数量角标
    function updateMeLikesCount() {
      const el = document.getElementById('me-likes-count');
      if (el) {
        el.textContent = Store.getLikes().length + Store.getAudioLikes().length;
      }
    }

    // 喜欢子页面是否处于打开状态（替代旧的 currentTab === 'likes' 判断）
    function likesPanelOpen() {
      return currentTab === 'me' && document.getElementById('me-view').classList.contains('likes-open');
    }

    // ===================== 听听：随机弹唱音频流 =====================
    // 统一音频结构（唯一归一化入口）：
    // { id, nickname, gender, avatar, songName, singer, lyrics[],
    //   audioUrl, durationSec, likeCount, link, publishAt }

    function normalizeAudio(data) {
      const u = data.user || {};
      const s = data.song || {};
      const a = data.audio || {};
      // HTTPS 页面不允许 http 音频（混合内容拦截），CDN 已确认支持 HTTPS，仅做协议升级
      const toHttps = (u0) => String(u0 || '').trim().replace(/^http:\/\//i, 'https://');
      const link = String(a.link || '').trim();
      const id = 'cy:' + (link.split('/').pop() || toHttps(a.url).slice(-32));
      return {
        id,
        nickname: String(u.nickname || '匿名唱作人'),
        gender: String(u.gender || ''),
        avatar: toHttps(u.avatar_url),
        songName: String(s.name || '未知歌曲'),
        singer: String(s.singer || ''),
        lyrics: Array.isArray(s.lyrics) ? s.lyrics.map(x => String(x)).filter(Boolean) : [],
        audioUrl: toHttps(a.url),
        durationSec: Math.max(1, Math.round((a.duration || 0) / 1000)),
        likeCount: Number(a.like_count) || 0,
        link,
        publishAt: Number(a.publish_at) || 0
      };
    }

    async function fetchChangya() {
      const url = useProxy ? '/api/changya' : `${MIRROR_HOSTS[mirrorIdx]}/v2/changya`;
      const res = await fetch(url);
      if (!res.ok) throw new Error('API请求失败');
      const json = await res.json();
      if (json.code !== 200 || !json.data || !json.data.audio) throw new Error('接口返回异常');
      return normalizeAudio(json.data);
    }

    async function fetchChangyaWithFallback() {
      if (useProxy) return await fetchChangya();
      for (let i = 0; i < MIRROR_HOSTS.length; i++) {
        try {
          mirrorIdx = i;
          return await fetchChangya();
        } catch (e) {
          if (i === MIRROR_HOSTS.length - 1) {
            useProxy = true;
            return await fetchChangya();
          }
        }
      }
    }

    async function fetchAudios(count) {
      return Promise.all(Array.from({ length: count }, () => fetchChangyaWithFallback()));
    }

    // 入池统一去重：会话已展示的、池内已有的都不收（并发批次可能抽到同一首）
    function pushAudioPool(items) {
      let added = 0;
      items.forEach(it => {
        if (!audioSeen.has(it.id) && !audioPool.some(p => p.id === it.id)) {
          audioPool.push(it);
          added++;
        }
      });
      return added;
    }

    // ---- 音频流状态（仅内存：音频链接带时效签名，不做持久化缓存） ----
    let audioPool = [];
    const audioSeen = new Set();
    let audioItems = [];      // 已渲染条目，主题切换重建用
    let listenLoading = false;
    let listenLoaded = false;

    function fmtDuration(sec) {
      sec = Math.max(0, Math.floor(sec || 0));
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function fmtCount(n) {
      if (n >= 10000) return (n / 10000).toFixed(1).replace(/\.0$/, '') + '万';
      return String(n);
    }

    function genderHtml(g) {
      if (g === 'female') return '<span class="au-gender female" title="女生">♀</span>';
      if (g === 'male') return '<span class="au-gender male" title="男生">♂</span>';
      return '';
    }

    function createAudioCard(item, options = {}) {
      const card = document.createElement('div');
      card.className = 'audio-card';
      card.dataset.id = item.id;
      if (options.noAnim) card.classList.add('no-anim');

      const lyricsHtml = item.lyrics.length
        ? `<div class="au-lyrics">${item.lyrics.map(l =>
            `<span class="lyr-line">${escapeHtml(l)}</span>`).join('')}</div>`
        : '';
      const avatarHtml = item.avatar
        ? `<img class="au-avatar" src="${escapeAttr(item.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'">`
        : '<div class="au-avatar"></div>';
      const singerHtml = item.singer
        ? `<span class="singer">原唱：${escapeHtml(item.singer)}</span>` : '';
      const timeHtml = item.publishAt
        ? `<span class="au-dot">·</span><span class="au-time">${formatTime(item.publishAt)}</span>` : '';

      card.innerHTML = `
        ${avatarHtml}
        <div class="au-main">
          <div class="au-head">
            <span class="au-name">${escapeHtml(item.nickname)}</span>
            ${genderHtml(item.gender)}
            ${timeHtml}
          </div>
          <div class="au-song">《${escapeHtml(item.songName)}》 ${singerHtml}</div>
          ${lyricsHtml}
          <div class="au-player">
            <button class="ap-play" aria-label="播放/暂停">
              <span class="ic-play">${SVG_ICONS.play}</span>
              <span class="ic-pause">${SVG_ICONS.pause}</span>
            </button>
            <div class="ap-mid">
              <input class="ap-range" type="range" min="0" max="${item.durationSec}" value="0" step="1" aria-label="播放进度">
              <div class="ap-times">
                <span class="t-cur">0:00</span>
                <span class="t-dur">${fmtDuration(item.durationSec)}</span>
              </div>
            </div>
          </div>
          <div class="ap-foot">
            <span class="ap-stat">${SVG_ICONS.heartSmall}${fmtCount(item.likeCount)}</span>
            <button class="ap-like ${Store.isAudioLiked(item.id) ? 'active' : ''}" aria-label="收藏这首歌" title="收藏">
              ${SVG_ICONS.heartSmall}
            </button>
          </div>
        </div>
      `;

      // 事件：播放/暂停 + 进度拖动
      const playBtn = card.querySelector('.ap-play');
      const range = card.querySelector('.ap-range');
      playBtn.addEventListener('click', () => Player.toggle(item, card));
      range.addEventListener('input', () => {
        if (Player.currentId !== item.id) return;
        Player.el.currentTime = parseFloat(range.value);
      });

      // 事件：收藏 / 取消收藏（同步该音频在信息流与喜欢页的所有卡片）
      const likeBtn = card.querySelector('.ap-like');
      likeBtn.addEventListener('click', () => {
        const wasLiked = Store.isAudioLiked(item.id);
        const nowLiked = wasLiked
          ? Store.removeAudioLike(item.id)
          : Store.addAudioLike(item);
        document.querySelectorAll('.audio-card').forEach(c => {
          if (c.dataset.id === item.id) {
            c.querySelector('.ap-like')?.classList.toggle('active', nowLiked);
          }
        });
        if (!wasLiked && nowLiked) {
          burstParticles(likeBtn);
          showToast(t('collectOk'));
        }
        // 在喜欢子页面取消收藏：立即从列表移除（播放器不受影响）
        if (likesPanelOpen() && !nowLiked) renderLikes();
      });

      // 若全局播放器正在播这条（主题切换重建场景），恢复 UI 态
      if (Player.currentId === item.id) {
        card.classList.add('playing');
        Player.attachUI(card);
        Player.syncUI();
      }

      return card;
    }

    // ---- 全局唯一播放器（单例：互斥、当前播放项单一事实来源） ----
    const Player = {
      el: null,
      currentId: null,
      currentItem: null,
      currentCard: null,

      ensure() {
        if (this.el) return;
        const el = new Audio();
        el.preload = 'none';
        el.addEventListener('timeupdate', () => this.syncUI());
        el.addEventListener('loadedmetadata', () => {
          if (this.currentCard) {
            const range = this.currentCard.querySelector('.ap-range');
            const dur = this.currentCard.querySelector('.t-dur');
            if (el.duration && isFinite(el.duration)) {
              range.max = Math.round(el.duration);
              dur.textContent = fmtDuration(el.duration);
            }
          }
          this.syncUI();
        });
        el.addEventListener('playing', () => {
          this.currentCard?.classList.remove('buffering');
        });
        el.addEventListener('waiting', () => {
          this.currentCard?.classList.add('buffering');
        });
        el.addEventListener('ended', () => this.reset());
        el.addEventListener('error', () => {
          const inLikes = this.currentCard && !!this.currentCard.closest('#likes-list');
          this.reset();
          showToast(inLikes ? t('audioFailLiked') : t('audioFail'));
        });
        this.el = el;
      },

      // 绑定当前卡片的 UI 引用（重建卡片后重新指向）
      attachUI(card) {
        this.currentCard = card;
      },

      syncUI() {
        const card = this.currentCard;
        if (!card || !this.el) return;
        const item = this.currentItem;
        if (!item) return;
        const range = card.querySelector('.ap-range');
        const cur = card.querySelector('.t-cur');
        const dur = isFinite(this.el.duration) && this.el.duration ? this.el.duration : item.durationSec;
        const pos = this.el.currentTime || 0;
        if (document.activeElement !== range) {
          range.value = Math.round(pos);
        }
        range.style.setProperty('--p', `${(pos / (dur || 1)) * 100}%`);
        cur.textContent = fmtDuration(pos);
      },

      reset() {
        const old = this.currentCard;
        if (old) {
          old.classList.remove('playing', 'buffering');
          const range = old.querySelector('.ap-range');
          const cur = old.querySelector('.t-cur');
          if (range) { range.value = 0; range.style.setProperty('--p', '0%'); }
          if (cur) cur.textContent = '0:00';
        }
        if (this.el) { this.el.pause(); this.el.removeAttribute('src'); this.el.load(); }
        this.currentId = null;
        this.currentItem = null;
        this.currentCard = null;
      },

      async toggle(item, card) {
        this.ensure();
        // 同一条：播放/暂停切换
        if (this.currentId === item.id) {
          if (this.el.paused) {
            card.classList.add('buffering');
            try { await this.el.play(); } catch (e) {}
          } else {
            this.el.pause();
            card.classList.remove('playing');
          }
          return;
        }
        // 切新歌：先复位旧卡片
        const oldCard = this.currentCard;
        if (oldCard && oldCard !== card) {
          oldCard.classList.remove('playing', 'buffering');
          const range = oldCard.querySelector('.ap-range');
          if (range) { range.value = 0; range.style.setProperty('--p', '0%'); }
          const cur = oldCard.querySelector('.t-cur');
          if (cur) cur.textContent = '0:00';
        }
        this.currentId = item.id;
        this.currentItem = item;
        this.currentCard = card;
        this.el.src = item.audioUrl;
        card.classList.add('playing', 'buffering');
        try {
          await this.el.play();
          card.classList.remove('buffering');
        } catch (e) {
          this.reset();
          showToast(t('audioFail'));
        }
      }
    };

    function rerenderAudioCards() {
      const list = document.getElementById('listen-list');
      if (!list || !audioItems.length) return;
      list.innerHTML = '';
      audioItems.forEach(it => list.appendChild(createAudioCard(it, { noAnim: true })));
    }

    async function loadMoreAudio() {
      if (listenLoading || currentTab !== 'listen') return;
      listenLoading = true;
      showListenLoading();

      const BATCH = 4;
      let picked = [];

      // 1) 内存池取
      while (audioPool.length && picked.length < BATCH) {
        const it = audioPool.shift();
        if (!audioSeen.has(it.id)) picked.push(it);
      }

      // 2) 不足则请求（最多补两轮，滤掉重复随机结果）
      if (picked.length < BATCH) {
        try {
          for (let round = 0; round < 2 && picked.length < BATCH; round++) {
            const batch = await fetchAudios(BATCH * 2);
            pushAudioPool(batch);
            while (audioPool.length && picked.length < BATCH) {
              const it = audioPool.shift();
              if (!audioSeen.has(it.id) && !picked.some(p => p.id === it.id)) picked.push(it);
            }
          }
        } catch (e) {
          if (picked.length === 0 && audioItems.length === 0) {
            showListenError();
            listenLoading = false;
            hideListenLoading();
            return;
          }
        }
      }

      // 3) 渲染（双保险：跳过任何重复 id）
      const list = document.getElementById('listen-list');
      picked.forEach(it => {
        if (audioSeen.has(it.id)) return;
        audioSeen.add(it.id);
        audioItems.push(it);
        list.appendChild(createAudioCard(it));
      });

      listenLoading = false;
      hideListenLoading();
      listenLoaded = true;

      // 4) 池子见底时后台补一批
      if (audioPool.length < 6) backgroundAudioPrefetch();
    }

    const audioPrefetching = { v: false };
    async function backgroundAudioPrefetch() {
      if (audioPrefetching.v) return;
      audioPrefetching.v = true;
      try {
        const batch = await fetchAudios(8);
        pushAudioPool(batch);
      } catch (e) { /* 静默 */ } finally {
        audioPrefetching.v = false;
      }
    }

    function showListenLoading() {
      if (document.getElementById('listen-loading')) return;
      const el = document.createElement('div');
      el.id = 'listen-loading';
      el.className = 'state-card';
      el.innerHTML = '<div class="spinner"></div><p>寻找正在唱歌的人...</p>';
      document.getElementById('listen-list').after(el);
    }
    function hideListenLoading() {
      document.getElementById('listen-loading')?.remove();
    }
    function showListenError() {
      const el = document.getElementById('listen-loading');
      if (el) {
        el.innerHTML = `<p>${t('loadFail')}</p><button class="retry-btn" onclick="loadMoreAudio()">${t('retry')}</button>`;
        el.classList.add('error-state');
      }
    }

    // ===================== 操作处理 =====================
    function handleAction(e) {
      const btn = e.target.closest('.action-btn');
      if (!btn) return;

      const action = btn.dataset.action;

      if (action === 'like') {
        const id = btn.dataset.id;
        const type = btn.dataset.type;
        const index = parseInt(btn.dataset.index);
        const wasLiked = Store.isLiked(id);
        // 喜欢时保存完整内容快照，取消时移除
        const isNowLiked = wasLiked
          ? Store.removeLike(id)
          : Store.addLike({ id, type, index, duanzi: btn.dataset.text });
        btn.classList.toggle('active', isNowLiked);
        // 更新表情图标 + 同步页面上同一条内容的其他按钮
        document.querySelectorAll('.like-btn').forEach(b => {
          if (b.dataset.id !== id) return;
          b.classList.toggle('active', isNowLiked);
          const emoji = b.querySelector('.emoji');
          if (emoji) emoji.textContent = isNowLiked ? '🤣' : '🙂';
        });
        // 仅在「变为喜欢」时触发粒子特效
        if (!wasLiked && isNowLiked) {
          burstParticles(btn);
        }
        // 在喜欢子页面取消喜欢：立即移除该卡片
        if (likesPanelOpen() && !isNowLiked) {
          renderLikes();
        }
      }

      else if (action === 'copy') {
        const text = btn.dataset.text;
        copyText(text);
      }
    }

    // ===================== X 风格粒子光晕特效（Web Animations API） =====================
    function burstParticles(btn) {
      const target = btn.querySelector('.emoji') || btn.querySelector('svg');
      if (!target) return;

      const rect = target.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;

      const elements = [];

      // 扩散光环
      const ring = document.createElement('div');
      ring.className = 'particle-ring';
      ring.style.left = cx + 'px';
      ring.style.top = cy + 'px';
      document.body.appendChild(ring);
      elements.push(ring);

      ring.animate([
        { opacity: 0.8, transform: 'translate(-50%, -50%) scale(0.3)' },
        { opacity: 0, transform: 'translate(-50%, -50%) scale(3)' }
      ], { duration: 800, easing: 'ease-out', fill: 'forwards' });

      // 生成 8 颗粒子，均匀放射
      const PARTICLE_COUNT = 8;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const angle = (Math.PI * 2 * i) / PARTICLE_COUNT + (Math.random() * 0.3 - 0.15);
        const dist = 32 + Math.random() * 16;
        const tx = Math.cos(angle) * dist;
        const ty = Math.sin(angle) * dist;
        const size = 9 + Math.random() * 5;

        const p = document.createElement('div');
        p.className = 'particle';
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.width = size + 'px';
        p.style.height = size + 'px';
        document.body.appendChild(p);
        elements.push(p);

        p.animate([
          { opacity: 1, transform: 'translate(-50%, -50%) scale(1.4)' },
          { opacity: 0.9, transform: `translate(calc(-50% + ${tx * 0.5}px), calc(-50% + ${ty * 0.5}px)) scale(1)`, offset: 0.5 },
          { opacity: 0, transform: `translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(0.3)` }
        ], { duration: 900, easing: 'cubic-bezier(0.16, 1, 0.3, 1)', fill: 'forwards' });
      }

      // 动画结束后清理 DOM
      setTimeout(() => elements.forEach(el => el.remove()), 1000);
    }

    async function copyText(text) {
      try {
        await navigator.clipboard.writeText(text);
        showToast(t('copyOk'));
      } catch (e) {
        // 兼容性 fallback
        const textarea = document.createElement('textarea');
        textarea.value = text;
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand('copy');
          showToast(t('copyOk'));
        } catch (err) {
          showToast(t('copyFail'));
        }
        document.body.removeChild(textarea);
      }
    }

    // ===================== Toast =====================
    let toastTimer = null;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 1800);
    }

    // ===================== Tab 切换 =====================
    const TABS = ['feed', 'listen', 'me'];

    function switchTab(tab) {
      if (!TABS.includes(tab)) return;
      currentTab = tab;
      document.body.dataset.tab = tab;
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

      document.getElementById(`${tab}-view`).classList.add('active');
      document.querySelector(`.tab[data-tab="${tab}"]`).classList.add('active');

      if (tab === 'me') {
        // 每次进入「我的」都回到菜单根层
        closeLikesPanel();
        updateMeLikesCount();
      }
      if (tab === 'listen' && !listenLoaded && !listenLoading) loadMoreAudio();
      // 在「我的」里切换过分类后，首页需要补载
      if (tab === 'feed' && !document.getElementById('feed-list').children.length) loadMoreJokes();

      // 回到顶部
      window.scrollTo({ top: 0, behavior: 'instant' });
      updateScrollTopBtn();
    }

    // 「我的」内：菜单 ⇄ 喜欢列表
    function openLikesPanel() {
      likesFilter = 'all'; // 每次进入默认「全部」
      document.getElementById('me-view').classList.add('likes-open');
      renderLikes();
      window.scrollTo({ top: 0, behavior: 'instant' });
      updateScrollTopBtn();
    }

    function closeLikesPanel() {
      document.getElementById('me-view').classList.remove('likes-open');
    }

    // ===================== 字号调节 =====================
    function applyFontSize() {
      document.documentElement.style.setProperty('--joke-font-size', fontSize + 'px');
      const v = document.getElementById('font-value');
      if (v) v.textContent = fontSize;
      // 样字按当前真实字号实时渲染
      const c = document.getElementById('fp-char');
      if (c) c.style.fontSize = fontSize + 'px';
    }

    function changeFontSize(delta) {
      fontSize = Math.max(14, Math.min(24, fontSize + delta));
      Store.saveFontSize(fontSize);
      applyFontSize();
      showToast(delta > 0 ? t('fontUp') : t('fontDown'));
    }

    // ===================== 主题切换（在「我的」页四选一） =====================
    // light / dark / paper = 正经主题（SVG 图标 + 中性文案）
    // fun = 整活主题（emoji 图标 + 浮动表情 + 段子梗文案）
    const THEMES = ['light', 'dark', 'fun', 'paper'];

    const THEME_COLORS = { light: '#ffffff', dark: '#000000', fun: '#fff6e6', paper: '#f8f0da' };

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      // 同步 meta theme-color
      document.querySelector('meta[name="theme-color"]').setAttribute('content', THEME_COLORS[theme] || '#000000');
      // 更新随主题变化的图标 / 文案 / 装饰 / 卡片
      applyThemeStyles();
    }

    // 更新主题色板选中态
    function updateThemeOptions(theme) {
      document.querySelectorAll('.theme-opt').forEach(opt => {
        opt.classList.toggle('active', opt.dataset.theme === theme);
      });
    }

    function selectTheme(theme) {
      if (!THEMES.includes(theme) || theme === Store.getTheme()) return;
      Store.saveTheme(theme);
      applyTheme(theme);
    }

    // 更新所有随主题变化的静态元素与卡片
    function applyThemeStyles() {
      const fun = isFun();

      // 「我的」页已看计数文案
      document.getElementById('seen-label').textContent = t('seenLabel');
      document.getElementById('seen-suffix').textContent = t('seenSuffix');

      // 底部 Tab 图标与文字
      document.querySelector('.tab[data-tab="feed"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.feed : SVG_ICONS.feed;
      document.querySelector('.tab[data-tab="listen"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.listen : SVG_ICONS.listen;
      document.querySelector('.tab[data-tab="me"] .tab-icon').innerHTML = fun ? EMOJI_ICONS.me : SVG_ICONS.me;
      document.getElementById('tab-label-feed').textContent = t('tabFeed');
      document.getElementById('tab-label-listen').textContent = t('tabListen');
      document.getElementById('tab-label-me').textContent = t('tabMe');

      // 「我的」页文案与图标
      document.getElementById('me-likes-label').textContent = t('meLikes');
      document.getElementById('me-likes-icon').innerHTML = fun ? EMOJI_ICONS.likesTrophy : SVG_ICONS.heart;
      document.getElementById('me-cat-title').textContent = t('meCategory');
      document.getElementById('me-display-title').textContent = t('meDisplay');
      document.getElementById('me-font-title').textContent = t('meFont');
      document.getElementById('me-fontface-title').textContent = t('meFontFace');
      document.getElementById('me-color-title').textContent = t('meColor');
      document.getElementById('me-theme-title').textContent = t('meTheme');
      document.getElementById('likes-top-title').textContent = t('likesTitle');
      updateThemeOptions(Store.getTheme());

      // auto 字体随主题变化（阅读主题→宋体）；自定义主题色在换肤后继续生效
      applyFontPref();
      applyAccent(Store.getAccent());

      // 回到顶部按钮
      document.querySelector('#scroll-top-btn .scroll-icon').innerHTML = fun ? EMOJI_ICONS.top : SVG_ICONS.top;

      // 清空喜欢按钮
      document.getElementById('clear-likes').textContent = t('clear');

      // 重建已渲染卡片，使图标/文案跟随主题
      rerenderCards();
    }

    // 重建信息流与历史页的卡片（保留滚动位置）
    function rerenderCards() {
      const feedList = document.getElementById('feed-list');
      if (feedList && feedJokes.length) {
        const y = window.scrollY;
        feedList.innerHTML = '';
        feedJokes.forEach(j => feedList.appendChild(createCard(j, { noAnim: true })));
        window.scrollTo({ top: y, behavior: 'instant' });
      }
      if (likesPanelOpen()) renderLikes();
      rerenderAudioCards();
    }

    // ===================== 回到顶部按钮 =====================
    function updateScrollTopBtn() {
      const btn = document.getElementById('scroll-top-btn');
      if (window.scrollY > 400) {
        btn.classList.add('show');
      } else {
        btn.classList.remove('show');
      }
    }

    // ===================== 无限滚动 =====================
    function setupInfiniteScroll() {
      const feedObs = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !isLoading && currentTab === 'feed') {
          loadMoreJokes();
        }
      }, { rootMargin: '600px' });
      feedObs.observe(document.getElementById('feed-sentinel'));

      const listenObs = new IntersectionObserver((entries) => {
        if (entries[0].isIntersecting && !listenLoading && currentTab === 'listen') {
          loadMoreAudio();
        }
      }, { rootMargin: '600px' });
      listenObs.observe(document.getElementById('listen-sentinel'));
    }

    // ===================== 旧数据迁移（一次性） =====================
    function migrateData() {
      if (localStorage.getItem('duanzi_migrate_v4')) return;
      try {
        // 喜欢列表升级为带复合 id 的快照
        const rawLikes = localStorage.getItem('duanzi_liked');
        if (rawLikes) {
          const old = JSON.parse(rawLikes);
          if (Array.isArray(old) && old.length && !('id' in old[0])) {
            if (typeof old[0] === 'number') {
              // 更老版本：纯编号数组，从历史/缓存里找回内容
              const contentMap = {};
              ['duanzi_history', 'duanzi_cache_v2', 'duanzi_cache', 'duanzi_cache_v3_duanzi'].forEach(key => {
                try {
                  (JSON.parse(localStorage.getItem(key)) || []).forEach(j => {
                    if (j && j.duanzi && !(j.index in contentMap)) contentMap[j.index] = j.duanzi;
                  });
                } catch (e) {}
              });
              const records = old
                .filter(i => contentMap[i])
                .map(i => ({ id: `duanzi:${i}`, type: 'duanzi', index: i, duanzi: contentMap[i], ts: 0 }));
              localStorage.setItem('duanzi_liked', JSON.stringify(records));
            } else {
              // 上一版：{ index, duanzi, ts }，补齐 id/type（旧内容均属搞笑段子）
              const records = old
                .filter(j => j && j.duanzi)
                .map(j => ({ id: `duanzi:${j.index}`, type: 'duanzi', index: j.index, duanzi: j.duanzi, ts: j.ts || 0 }));
              localStorage.setItem('duanzi_liked', JSON.stringify(records));
            }
          }
        }
        // 旧版已看 / 浏览历史 → 按分类隔离的 v3 key（全部归入搞笑段子）
        const seen = new Set(Store.getSeen('duanzi'));
        try {
          (JSON.parse(localStorage.getItem('duanzi_seen')) || []).forEach(i => seen.add(i));
        } catch (e) {}
        try {
          (JSON.parse(localStorage.getItem('duanzi_history')) || []).forEach(h => seen.add(h.index));
        } catch (e) {}
        if (seen.size) Store.saveSeen('duanzi', [...seen]);
        localStorage.removeItem('duanzi_seen');
        localStorage.removeItem('duanzi_history');
      } catch (e) {}
      localStorage.setItem('duanzi_migrate_v4', '1');
    }

    // ===================== 内容分类切换（在「我的」页选择） =====================
    function renderCategoryUI() {
      document.querySelectorAll('.me-cat').forEach(mi => {
        mi.classList.toggle('active', mi.dataset.category === currentCategory);
      });
    }

    function switchCategory(type) {
      if (!CATEGORY_MAP[type] || type === currentCategory) return;
      currentCategory = type;
      Store.saveCategory(type);

      // 重置信息流（各分类缓存/已看独立）
      document.getElementById('feed-list').innerHTML = '';
      feedJokes = [];
      seenIndices = new Set(Store.getSeen(type).map(i => `${type}:${i}`));
      isLoading = false;
      hideFeedLoading();
      updateSeenCount();
      renderCategoryUI();
      // 回到首页立刻看到新分类；仍停在「我的」也会在切回首页时补载
      switchTab('feed');
      loadMoreJokes();
    }

    // ===================== 初始化 =====================
    function init() {
      // 旧数据迁移
      migrateData();

      // 初始 Tab 标记（控制顶栏标题显隐）
      document.body.dataset.tab = currentTab;

      // 应用字号
      applyFontSize();

      // 恢复当前分类的已看记录（用于计数与会话去重）
      Store.getSeen(currentCategory).forEach(i => seenIndices.add(`${currentCategory}:${i}`));
      updateSeenCount();
      renderCategoryUI();

      // 事件委托：操作按钮
      document.addEventListener('click', (e) => {
        if (e.target.closest('.action-btn')) {
          handleAction(e);
        }
      });

      // Tab 切换（重复点「我的」= 从喜欢子页面返回菜单根层）
      document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => {
          if (tab.dataset.tab === 'me' && currentTab === 'me' && likesPanelOpen()) {
            closeLikesPanel();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            return;
          }
          switchTab(tab.dataset.tab);
        });
      });

      // 「我的」：进入 / 返回喜欢列表
      document.getElementById('me-open-likes').addEventListener('click', openLikesPanel);
      document.getElementById('me-likes-back').addEventListener('click', closeLikesPanel);

      // 喜欢列表分类筛选（胶囊会随 renderLikes 重建，用事件委托）
      document.getElementById('likes-filter').addEventListener('click', (e) => {
        const chip = e.target.closest('.lf-chip');
        if (!chip || chip.classList.contains('active')) return;
        likesFilter = chip.dataset.filter;
        renderLikes();
      });

      // 内容分类（我的页内联选择，选中即切回首页）
      document.querySelectorAll('.me-cat').forEach(item => {
        item.addEventListener('click', () => switchCategory(item.dataset.category));
      });

      // 字号调节
      document.getElementById('font-decrease').addEventListener('click', () => changeFontSize(-1));
      document.getElementById('font-increase').addEventListener('click', () => changeFontSize(1));

      // 字体选项（先渲染，applyTheme 时才能同步选中态与 auto 字体栈）
      renderFontOptions();

      // 主题色：预设色板直选
      document.getElementById('accent-opts').addEventListener('click', (e) => {
        const btn = e.target.closest('.accent-opt');
        if (!btn) return;
        const hex = (btn.dataset.accent || '').trim();
        Store.saveAccent(hex);
        applyAccent(hex);
      });
      // 主题色：自定义取色器（拖动即实时预览，松手/确认时值相同无副作用）
      const accentPicker = document.getElementById('accent-picker');
      accentPicker.addEventListener('input', () => {
        Store.saveAccent(accentPicker.value);
        applyAccent(accentPicker.value);
      });

      // 主题：四枚色板直选
      document.querySelectorAll('.theme-opt').forEach(opt => {
        opt.addEventListener('click', () => selectTheme(opt.dataset.theme));
      });
      applyTheme(Store.getTheme());
      updateMeLikesCount();

      // 回到顶部
      document.getElementById('scroll-top-btn').addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });

      // 滚动监听
      window.addEventListener('scroll', updateScrollTopBtn, { passive: true });

      // 清空喜欢
      document.getElementById('clear-likes').addEventListener('click', () => {
        likesFilter = 'all';
        Store.clearLikes();
        Store.clearAudioLikes();
        // 同步信息流中所有卡片的喜欢按钮状态（含整活主题的 emoji）
        document.querySelectorAll('.like-btn').forEach(b => {
          b.classList.remove('active');
          const em = b.querySelector('.emoji');
          if (em) em.textContent = '🙂';
        });
        // 同步音频卡片收藏按钮
        document.querySelectorAll('.ap-like').forEach(b => b.classList.remove('active'));
        renderLikes();
        showToast(t('clearOk'));
      });

      // 无限滚动
      setupInfiniteScroll();

      // 首次加载：优先秒显本地缓存，不足时自动请求并后台预热
      loadMoreJokes();
    }

    // DOM 就绪后初始化
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
